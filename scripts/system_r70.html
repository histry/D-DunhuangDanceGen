<!doctype html><meta charset="utf-8"><title>R70 系统预比较</title><style>body{background:#102132;color:#ddd;font:16px sans-serif;margin:22px}section{display:flex;gap:15px}article{flex:1;min-width:240px}canvas{width:100%;background:#183047}button,input{margin:8px}small{display:block;color:#ddbd81}</style><h1>R70 · 整曲系统预比较</h1><p>同一首 dunhuangwu2、完整3601帧，统一22关节、相机和米制比例。当前系统获得真实ChangE来源；EDGE为AIST++预训练、无ChangE条件。差异不能单独证明音乐理解更好。</p><p>ChoreoGraph 尚未找到可核验官方代码／权重，本栏不可评，没有用DTW改编代替。全部是历史开发音乐；独立质量、敦煌文化风格和Native24待评价。</p><audio id="audio" src="music.wav"></audio><button id="play">共同播放</button><button id="pause">共同暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="rate"><option>1</option><option>0.5</option></select><input id="seek" type="range" min="0" value="0"><span id="clock"></span><section id="panels"></section><small>Root-relative局部视角不呈现世界移动与接触。本页是系统预比较，不是三方法完整复现或质量排名。</small><script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.querySelector('#data').textContent),a=document.querySelector('audio'),$=x=>document.getElementById(x);let frame=0;const views=D.arms.map(v=>{let t=document.createElement('article');t.innerHTML='<h2>'+v.name+'</h2><canvas width="380" height="420"></canvas>';$('panels').append(t);return {v,c:t.querySelector('canvas').getContext('2d')}});$('seek').max=D.frames-1;
function draw(f){frame=Math.max(0,Math.min(D.frames-1,f));$('seek').value=frame;$('clock').textContent=frame+' / '+(D.frames-1)+' · '+(frame/30).toFixed(3)+'秒';for(const {v,c} of views){c.clearRect(0,0,380,420);if(!v.P){c.fillStyle='#e9c687';c.fillText('未复现 · 不可评价',70,160);continue}let p=v.P[frame].map(v=>[190+150*(v[0]+.35*v[2]),350-150*(v[1]-.15*v[2])]);c.lineWidth=2;c.strokeStyle='#88dcc8';for(let j=1;j<22;j++){let k=D.parents[j];c.beginPath();c.moveTo(...p[k]);c.lineTo(...p[j]);c.stroke()}}}
function seek(f){a.pause();draw(f);a.currentTime=frame/30}$('seek').oninput=e=>seek(+e.target.value);$('prev').onclick=()=>seek(frame-1);$('next').onclick=()=>seek(frame+1);$('play').onclick=()=>a.play();$('pause').onclick=()=>a.pause();$('rate').onchange=e=>a.playbackRate=+e.target.value;a.onseeked=()=>draw(Math.floor(a.currentTime*30+1e-4));function tick(){if(!a.paused)draw(Math.floor(a.currentTime*30+1e-4));requestAnimationFrame(tick)}draw(0);requestAnimationFrame(tick);
</script>
