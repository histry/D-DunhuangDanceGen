<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper 1 · 逐槽执行审计</title>
<style>body{font:15px system-ui;background:#f5f4ef;color:#203b3b;margin:20px;max-width:1500px}button,select{padding:7px;margin:3px}h1{font-size:24px}canvas{background:white;border-radius:9px;width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.box{background:white;padding:12px;border-radius:12px}#seek{width:95%}#slots{display:flex;margin:10px 0;gap:2px}#slots button{padding:5px 0;margin:0;flex:1;min-width:12px;font-size:12px}.selected{background:#a7d6cc}pre{white-space:pre-wrap;font-size:12px}summary{cursor:pointer}audio{width:100%}.note{color:#77532e}#error{color:#962d28}</style>
<h1>来源保持编舞 · 每槽音乐与执行时钟</h1><p>三首历史开发音乐 · 冻结 R56 B0 完整轨迹。候选为真实 SO(3) 重采样，未替换整曲路径。SDMR 仅 Shadow；语义卡点、艺术质量、世界 Root／接触与 Native24 未获资格。</p>
<label>音乐 <select id="song"></select></label><button id="play">共同播放</button><button id="pause">暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><label>倍速 <select id="rate"><option>.5</option><option selected>1</option><option>1.5</option></select></label><label>视角 <input id="yaw" type="range" min="-180" max="180" value="-20"></label>
<audio id="audio" controls preload="metadata"></audio><input id="seek" type="range" min="0" max="3600" value="0" step="1"><span id="frame"></span><div id="slots"></div>
<label>来源及执行候选 <select id="candidate"></select></label><p id="status"></p><div class="grid"><section class="box"><h3>完整编舞 · 冻结基线</h3><canvas id="full" width="440" height="360"></canvas></section><section class="box"><h3>当前槽 · 实际执行候选</h3><canvas id="core" width="440" height="360"></canvas><p class="note">只在该 Core 的实际音乐区间显示；过渡区留空。</p></section><section class="box"><h3>来源原速 · 独立时钟／静音</h3><canvas id="source" width="440" height="360"></canvas><button id="sourcePlay">原速播放／暂停</button><input id="sourceSeek" type="range" min="0" max="200" value="0"><span id="sourceFrame"></span></section></div>
<h3>时间映射与事件位置</h3><canvas id="clock" width="1000" height="160"></canvas><p>蓝色：目标帧→来源帧；橙线：自动音乐事件；红点：映射后的来源节点。它们都不等于独立艺术卡点真值。</p><details><summary>来源身份、合法证书与两类事件误差</summary><pre id="details"></pre></details><p id="error"></p>
<script src="data.js"></script><script>
const $=id=>document.getElementById(id);let D,S,C,K,base,body,src,frame=0,slot=0,sourceFrame=0,sourceRunning=false,sourceStart=0,sourceOrigin=0;
function bytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function decode(s){return new Float32Array(bytes(s).buffer)}
function pose(id,P,f){const c=$(id),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);if(!P||f<0||f>=P.length/66){g.fillStyle='#77532e';g.fillText('当前为过渡或该槽范围之外',20,30);return}const y=+$('yaw').value*Math.PI/180;const project=j=>{let k=f*66+j*3;return [220+150*(Math.cos(y)*P[k]+Math.sin(y)*P[k+2]),300-150*P[k+1]]};g.lineWidth=3;g.strokeStyle='#297b77';for(let j=1;j<22;j++){let a=project(j),b=project(D.parents[j]);g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}g.fillStyle='#d18a44';for(let j=0;j<22;j++){let a=project(j);g.beginPath();g.arc(...a,3,0,7);g.fill()}}
function drawClock(){let c=$('clock'),g=c.getContext('2d');g.clearRect(0,0,1000,160);const [A,B]=K.target_interval,[a,b]=C.source_interval;for(let e of K.music_events){if(!['beat','downbeat','accent_candidate'].includes(e.kind))continue;let x=(e.frame_float-A)/(B-A-1)*1000;g.strokeStyle=e.kind==='downbeat'?'#ac3d2d':'#ead8c0';g.beginPath();g.moveTo(x,0);g.lineTo(x,160);g.stroke()}g.strokeStyle='#247fa0';g.beginPath();C.q.forEach((v,i)=>{let x=i/(C.q.length-1)*1000,y=145-(v-a)/(b-a-1)*125;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#b53824';for(let e of C.alignment.correspondences){g.beginPath();g.arc((e.mapped_source_event_frame-A)/(B-A-1)*1000,145-(e.source_frame-a)/(b-a-1)*125,4,0,7);g.fill()}g.fillRect((frame-A)/(B-A-1)*1000,0,2,160)}
function show(){frame=Math.max(0,Math.min(S.frames-1,frame));$('seek').value=frame;$('frame').textContent=`${frame}/${S.frames-1} · ${(frame/30).toFixed(3)}秒`;pose('full',base,frame);pose('core',body,frame-K.target_interval[0]);pose('source',src,sourceFrame);$('sourceFrame').textContent=`${sourceFrame}/${src.length/66-1}`;drawClock()}
function seek(f){$('audio').pause();frame=f;$('audio').currentTime=f/30;show()}
function selectCandidate(){C=K.candidates[+$('candidate').value];body=decode(C.data);src=decode(D.sources[C.event_uid].data);sourceRunning=false;sourceFrame=0;$('sourceSeek').max=src.length/66-1;$('sourceSeek').value=0;$('details').textContent=JSON.stringify({...C,data:undefined,q:undefined},null,2);$('status').textContent=`槽 ${slot+1} [${K.target_interval}] · ${C.source_uid} · ${C.origin} · 独立语义未知；新候选G1尚待同预算阶段实测`;show()}
function selectSlot(k,jump=true){slot=k;K=S.slots[k];$('candidate').replaceChildren();K.candidates.forEach((r,i)=>{$('candidate').add(new Option(`${r.source_uid} · ${r.origin} · ${r.uid.slice(0,8)}`,i))});$('candidate').value=K.candidates.findIndex(r=>r.uid===K.selected_baseline_uid);[...$('slots').children].forEach((b,i)=>b.className=i===k?'selected':'');selectCandidate();if(jump)seek(K.target_interval[0])}
function selectSong(){S=D.songs[+$('song').value];$('audio').pause();$('audio').src=S.audio;$('audio').playbackRate=+$('rate').value;base=decode(S.baseline);frame=0;$('seek').max=S.frames-1;$('slots').replaceChildren();S.slots.forEach((s,k)=>{let b=document.createElement('button');b.textContent=k+1;b.title=`Core ${k+1} [${s.target_interval}]`;b.onclick=()=>selectSlot(k);$('slots').append(b)});selectSlot(0,false);show()}
$('candidate').onchange=selectCandidate;$('song').onchange=selectSong;$('play').onclick=()=>$('audio').play().catch(e=>$('error').textContent=e.message);$('pause').onclick=()=>$('audio').pause();$('prev').onclick=()=>seek(frame-1);$('next').onclick=()=>seek(frame+1);$('seek').oninput=()=>seek(+$('seek').value);$('rate').onchange=()=>$('audio').playbackRate=+$('rate').value;$('yaw').oninput=show;
$('audio').onseeked=()=>{frame=Math.min(S.frames-1,Math.round($('audio').currentTime*30));show()};$('sourceSeek').oninput=()=>{sourceRunning=false;sourceFrame=+$('sourceSeek').value;show()};$('sourcePlay').onclick=()=>{sourceRunning=!sourceRunning;sourceStart=performance.now();sourceOrigin=sourceFrame};$('clock').onclick=e=>{let r=e.currentTarget.getBoundingClientRect();seek(K.target_interval[0]+Math.round((e.clientX-r.left)/r.width*(K.target_interval[1]-K.target_interval[0]-1)))};
function tick(t){if(S){if(!$('audio').paused){frame=Math.min(S.frames-1,Math.floor($('audio').currentTime*30));let k=S.slots.findIndex(s=>s.target_interval[0]<=frame&&frame<s.target_interval[1]);if(k>=0&&k!==slot)selectSlot(k,false)}if(sourceRunning){sourceFrame=(sourceOrigin+Math.floor((t-sourceStart)*.03))%(src.length/66);$('sourceSeek').value=sourceFrame}show()}requestAnimationFrame(tick)}
(async()=>{let stream=new Blob([bytes(window.P0_GZIP)]).stream().pipeThrough(new DecompressionStream('gzip'));D=JSON.parse(await new Response(stream).text());D.songs.forEach((s,i)=>$('song').add(new Option('dunhuangwu'+(s.song+2),i)));selectSong();requestAnimationFrame(tick)})().catch(e=>$('error').textContent=e.stack);
</script></html>
