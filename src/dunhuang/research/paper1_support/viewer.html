<!doctype html><meta charset="utf-8"><title>来源容量与时钟对照</title>
<style>body{margin:22px;background:#102132;color:#deedf3;font:16px system-ui}a{color:#85dce9}button,select,input{padding:7px;margin:4px}section{display:flex;flex-wrap:wrap;gap:14px}article{width:280px}canvas{background:#193349;width:280px}pre{white-space:pre-wrap;font:12px monospace}.warn{color:#efc177}table{border-collapse:collapse}td,th{border:1px solid #496372;padding:6px}#seek{width:300px}</style>
<h1 id="title"></h1><p class="warn">固定来源的时间对照，与替换来源的内容对照分别显示。低活动不是错误定势；GTW成本、停顿缩短和G1筛查均不能代替独立音乐／自然性评价。</p>
<p><a href="sources.html">14轨道原始来源检查</a> · <a href="index.html">返回实际执行对照</a></p><select id="pick"></select><select id="mode"><option value="core">Core</option><option value="pair">Core＋48帧G1＋固定邻接</option></select>
<div id="controls"><audio id="audio" controls></audio><br><button id="play">共同播放</button><button id="pause">暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="rate"><option>1</option><option>0.5</option><option>0.25</option><option>1.5</option></select><input id="seek" type="range" min="0" value="0"><span id="clock"></span></div>
<section id="panels"></section><h3>执行时钟（来源帧／目标帧）</h3><canvas id="warp" width="560" height="160" style="width:560px"></canvas><div id="metrics"></div><details><summary>来源支持、缺失与未验证状态</summary><pre id="detail"></pre></details><details><summary>来源资产目录（14轨道／11录制组）</summary><pre id="inventory"></pre></details><p class="warn">女冥想、分合绸带未找到符合完整混合支持规则的机会，没有替换成更容易的测试样本。6条多人轨道仅供检查，未自动加入Solo编排库。全部为历史开发人口；独立质量和Native24均不可评价。</p>
<script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),A=$('audio');let item,f=0,sf=0,running=false,start=0,rawCanvas,views=[];
$('title').textContent=D.title;$('inventory').textContent=JSON.stringify(D.inventory,null,2);D.items.forEach((v,i)=>{let o=document.createElement('option');o.value=i;o.textContent=v.label;$('pick').append(o)});
function panel(title){let a=document.createElement('article'),h=document.createElement('h3');h.textContent=title;a.append(h);let c=document.createElement('canvas');c.width=280;c.height=330;a.append(c);$('panels').append(a);return [a,c]}
function pose(c,P,n,low){let g=c.getContext('2d');g.clearRect(0,0,280,330);if(!P){g.fillStyle='#efc177';g.fillText('未构造／未补替代轨迹',30,150);return}n=Math.min(P.length-1,Math.max(0,n));let points=P[n].map(x=>[140+108*(x[0]+.35*x[2]),160-108*(x[1]-.15*x[2])]);g.strokeStyle='#80d4c2';g.lineWidth=2;for(let j=1;j<22;j++){g.beginPath();g.moveTo(...points[D.parents[j]]);g.lineTo(...points[j]);g.stroke()}g.fillStyle='#e7eff3';g.fillText('帧 '+n+' / '+(P.length-1),8,20);if(low){g.fillStyle='#38627e';g.fillRect(0,300,280,7);g.fillStyle='#e9ad4b';low.forEach((v,i)=>{if(v)g.fillRect(i/low.length*280,300,280/low.length+1,7)});g.fillStyle='#fff';g.fillRect(n/(P.length-1)*279,297,1,13)}}
function frames(){return $('mode').value==='pair'?2*item.T+48:item.T}
function draw(){pose(rawCanvas,item.sourceP,sf);views.forEach(([v,c])=>pose(c,$('mode').value==='pair'?v.fullP:v.P,f,$('mode').value==='core'?v.metrics.low_cells:null));$('seek').value=f;$('seek').max=frames()-1;$('clock').textContent=f+' / '+(frames()-1)+' · '+(f/30).toFixed(3)+'s'}
function seek(n){A.pause();f=Math.min(frames()-1,Math.max(0,n));if(item.audio)A.currentTime=f/30;draw()}
function load(){A.pause();running=false;item=D.items[+$('pick').value];f=sf=0;$('panels').replaceChildren();views=[];let [a,c]=panel('原速来源 · 独立播放');rawCanvas=c;let b=document.createElement('button');b.textContent='原速播放／暂停';b.onclick=()=>{running=!running;if(sf>=item.sourceP.length-1)sf=0;start=performance.now()-sf/30*1000};a.prepend(b);let s=document.createElement('input');s.type='range';s.max=item.sourceP.length-1;s.value=0;s.oninput=()=>{running=false;sf=+s.value;draw()};a.append(s);for(let v of item.variants){let [p,cv]=panel(v.label+' · G1 '+(v.connection?'通过':'未通过'));views.push([v,cv])}$('controls').hidden=!item.audio;$('mode').hidden=!item.audio;if(item.audio)A.src=item.audio;else A.removeAttribute('src');$('detail').textContent=JSON.stringify({source_interval:item.source_interval,automatic_low_span:item.hold,alternative_source_interval:item.alternative,status:D.status,quality:'NOT_EVALUABLE',can_route:false},null,2);let html='<table><tr><th>执行</th><th>最长低活动(s)</th><th>低活动比例</th><th>D3 Q95</th></tr>';for(let v of item.variants)html+='<tr><td>'+v.label+'</td><td>'+v.metrics.longest_low_seconds.toFixed(3)+'</td><td>'+(100*v.metrics.low_cell_fraction).toFixed(1)+'%</td><td>'+v.metrics.FK_D3_q95.toFixed(2)+'</td></tr>';$('metrics').innerHTML=html+'</table>';let g=$('warp').getContext('2d');g.clearRect(0,0,560,160);let colors=['#aaa','#76d8df','#ffbb70','#d6a4df','#9ddf79','#df7e7e'];item.variants.forEach((v,k)=>{let [a,b]=v.source_interval;g.strokeStyle=colors[k%colors.length];g.beginPath();v.q.forEach((q,i)=>{let x=10+i/(v.q.length-1)*540,y=150-(q-a)/(b-a-1)*140;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()});draw()}
$('pick').onchange=load;$('mode').onchange=()=>seek(0);$('seek').oninput=e=>seek(+e.target.value);$('prev').onclick=()=>seek(f-1);$('next').onclick=()=>seek(f+1);$('play').onclick=()=>{if(f>=frames()-1)seek(0);A.play()};$('pause').onclick=()=>A.pause();$('rate').onchange=()=>A.playbackRate=+$('rate').value;A.onseeked=()=>{f=Math.min(frames()-1,Math.max(0,Math.round(A.currentTime*30)));draw()};function tick(){if(!A.paused){f=Math.floor(A.currentTime*30+1e-5);if(f>=frames()-1){f=frames()-1;A.pause()}}if(running){sf=Math.floor((performance.now()-start)/1000*30);if(sf>=item.sourceP.length-1){sf=item.sourceP.length-1;running=false}}draw();requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script>
