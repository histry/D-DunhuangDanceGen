<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>R66 真实配对时钟检查</title><style>
body{margin:0;background:#101824;color:#e5ecf4;font:16px system-ui;max-width:1200px;margin:auto;padding:24px}button,select,input{font:inherit;margin:5px;padding:8px;background:#22354b;color:white;border:1px solid #56708d;border-radius:5px}canvas{background:#182534;width:min(100%,650px);height:auto;border:1px solid #40546d}p{line-height:1.6}.sub{color:#a6bad0}input[type=range]{width:60%}pre{white-space:pre-wrap;font-size:13px}</style>
<h1>R66 · 真实配对音乐—动作时钟</h1><p>动作保持不变，只改变读取音频的时间。真实时钟为 0；正偏移表示读取更晚音频。三个样例在评分前按身份选定，不代表最佳或最差结果。</p>
<p class="sub">22 关节局部姿态视图；世界 Root、接触与文化语义未评价。FineDance 仅具备官方同 ID／共同起点，未达到 AIST++ 的波形校准证据级别。此处不是新生成舞蹈，也不是艺术质量盲评。</p>
<select id="sample"></select><select id="offset"></select><br><button id="play">播放</button><button id="pause">暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><input id="seek" type="range" min="0" max="119" value="0"><output id="frame"></output><br>
<canvas id="canvas" width="650" height="520"></canvas><audio id="audio" preload="metadata"></audio><p id="scope"></p><details><summary>固定身份与诊断读数</summary><pre id="details"></pre></details>
<script>
const data=__DATA__;const $=id=>document.getElementById(id),audio=$('audio'),canvas=$('canvas'),ctx=canvas.getContext('2d');let item,control,pausedFrame=0;
data.items.forEach((x,i)=>$('sample').add(new Option(x.dataset+' / '+x.role+' / '+x.source_uid,i)));
function refreshAudio(){audio.pause();pausedFrame=0;control=item.controls[+$('offset').value];audio.src=control.file;audio.currentTime=0;draw(0)}
function select(){item=data.items[+$('sample').value];$('offset').replaceChildren();item.controls.forEach((x,i)=>$('offset').add(new Option((x.delta===0?'真实来源时钟':'非循环音频偏移')+' '+x.delta+' 帧',i)));$('offset').value='2';$('scope').textContent=item.clock_scope;$('details').textContent=JSON.stringify({uid:item.uid,interval:item.interval,scores:item.scores},null,2);refreshAudio()}
function draw(frame){frame=Math.max(0,Math.min(119,frame));let p=item.P[frame];ctx.clearRect(0,0,650,520);ctx.strokeStyle='#69d9c4';ctx.lineWidth=3;ctx.fillStyle='#edf5ff';for(let j=0;j<22;j++){const k=data.parents[j];if(k<0)continue;let a=p[j],b=p[k];ctx.beginPath();ctx.moveTo(325+a[0]*220,275-a[1]*220+a[2]*25);ctx.lineTo(325+b[0]*220,275-b[1]*220+b[2]*25);ctx.stroke()}ctx.fillStyle='#f4c66b';ctx.fillText('源帧 '+(item.interval[0]+frame)+' / 音频偏移 '+control.delta+' 帧',16,28);ctx.strokeStyle='#748ca4';ctx.beginPath();ctx.moveTo(15,480);ctx.lineTo(635,480);ctx.stroke();for(const x of control.beat_frames){ctx.fillStyle='#6da7f7';ctx.fillRect(15+x/120*620,470,2,20)}for(const x of item.motion_peaks){ctx.fillStyle='#f3b35e';ctx.fillRect(15+x/120*620,448,3,15)}ctx.fillStyle='#fff';ctx.fillRect(15+frame/120*620,443,2,54);$('seek').value=frame;$('frame').textContent='帧 '+frame+' · '+(frame/30).toFixed(3)+' 秒'}
function jump(f){audio.pause();pausedFrame=Math.max(0,Math.min(119,f));audio.currentTime=pausedFrame/30;draw(pausedFrame)}
$('sample').onchange=select;$('offset').onchange=refreshAudio;$('play').onclick=()=>audio.play();$('pause').onclick=()=>{audio.pause();pausedFrame=Math.min(119,Math.floor(audio.currentTime*30));draw(pausedFrame)};$('seek').oninput=e=>jump(+e.target.value);$('prev').onclick=()=>jump((audio.paused?pausedFrame:Math.floor(audio.currentTime*30))-1);$('next').onclick=()=>jump((audio.paused?pausedFrame:Math.floor(audio.currentTime*30))+1);audio.onended=()=>{pausedFrame=119;draw(119)};
function tick(){if(!audio.paused){pausedFrame=Math.min(119,Math.floor(audio.currentTime*30));draw(pausedFrame)}requestAnimationFrame(tick)}select();tick();
</script></html>
