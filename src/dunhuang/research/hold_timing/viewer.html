<!doctype html><meta charset="utf-8"><title>来源停顿审计</title><style>body{background:#102132;color:#deedf3;font:16px sans-serif;margin:18px}button,select,input{padding:7px;margin:4px}a{color:#8bd8ee}section{display:flex;gap:12px;flex-wrap:wrap}article{width:300px}canvas{width:300px;background:#183047}pre{white-space:pre-wrap;font-size:13px}.warn{color:#edc277}table{border-collapse:collapse}td,th{border:1px solid #456;padding:6px}</style>
<h1 id="title"></h1><p class="warn">橙色只表示身体相对低活动代理，不是“错误停顿”。Root世界位移、手指、接触和定势语义未知。原速来源独立播放，不跟随目标音乐变速。</p><a href="source.html">完整原速来源入口</a><br><select id="pick"></select><select id="candidate"></select><select id="mode"><option value="core">240帧Core</option><option value="pair">含48帧G1的528帧片段</option></select><div><audio id="audio" controls></audio><button id="play">目标共同播放</button><button id="pause">目标暂停</button><button id="prev">目标前一帧</button><button id="next">目标后一帧</button><input id="seek" type="range" min="0" max="239" value="0"><span id="clock"></span></div>
<section><article><h3>原速来源 · 独立时钟</h3><button id="sourcePlay">原速播放／暂停</button><input id="sourceSeek" type="range" min="0" value="0"><span id="sourceClock"></span><canvas id="raw" width="300" height="370"></canvas></article><article><h3>E1-W／共同池参考</h3><canvas id="base" width="300" height="370"></canvas></article><article><h3 id="candidateTitle"></h3><canvas id="new" width="300" height="370"></canvas></article></section>
<div id="summary"></div><p>时钟曲线：横轴为Core目标帧，纵轴为来源帧；灰色E1-W、青色候选。点击低活动区按钮可跳到对应目标位置。</p><canvas id="warp" width="300" height="150"></canvas><div id="jumps"></div><details><summary>实际低活动区、姿态漂移和来源支持</summary><pre id="evidence"></pre></details><p class="warn">具名开发观看；没有独立人工偏好。GTW成本、停顿代理或D3数值的变化均不自动表示舞蹈更好。</p>
<script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),audio=$('audio');let item,chosen,baseline,f=0,sf=0,sourceRunning=false,sourceStart=0;
$('title').textContent=D.title;D.items.forEach((v,i)=>{let o=document.createElement('option');o.value=i;o.textContent=v.label;$('pick').append(o)});
function sketch(id,P,frame,m){let c=$(id).getContext('2d');c.clearRect(0,0,300,370);if(!P){c.fillStyle='#efc277';c.fillText('缺失执行，未替换',40,150);return}frame=Math.min(P.length-1,Math.max(0,frame));let p=P[frame].map(x=>[150+115*(x[0]+.35*x[2]),175-115*(x[1]-.15*x[2])]);c.strokeStyle='#8bdcca';c.lineWidth=2;for(let j=1;j<22;j++){c.beginPath();c.moveTo(...p[D.parents[j]]);c.lineTo(...p[j]);c.stroke()}if(m){let n=m.low_cells.length;c.fillStyle='#276786';c.fillRect(0,320,300,8);c.fillStyle='#e4a249';m.low_cells.forEach((b,i)=>{if(b)c.fillRect(i/n*300,320,300/n+1,8)});c.fillStyle='#fff';c.fillRect(frame/Math.max(1,P.length-1)*299,317,1,15)}}
function pair(){return $('mode').value==='pair'}function offset(){return pair()?0:item.core_offset}function nframes(){return pair()?528:240}
function draw(){let ispair=pair();sketch('raw',item.sourceP,sf,item.sourceMetrics);sketch('base',baseline&&(ispair?baseline.fullP:baseline.P),f,baseline&&(ispair?baseline.fullMetrics:baseline.metrics));sketch('new',chosen&&(ispair?chosen.fullP:chosen.P),f,chosen&&(ispair?chosen.fullMetrics:chosen.metrics));$('seek').max=nframes()-1;$('seek').value=f;$('clock').textContent=f+'/'+(nframes()-1)+' · '+(f/30).toFixed(3)+'秒';$('sourceClock').textContent='来源帧 '+(sf+item.source_interval[0])+' · 原速 '+(sf/30).toFixed(3)+'秒';$('sourceSeek').value=sf}
function stop(){audio.pause()}function seek(n){stop();f=Math.min(nframes()-1,Math.max(0,n));if(item.audio)audio.currentTime=(f+offset())/30;draw()}
function summary(){let rr=[['原速来源',item.sourceMetrics],['E1-W',baseline?.metrics],['候选',chosen?.metrics]];let html='<table><tr><th>Core</th><th>最长低活动秒</th><th>低活动比例</th><th>FK D3 Q95</th></tr>';for(let [label,m] of rr)html+='<tr><td>'+label+'</td><td>'+(m?m.longest_low_seconds.toFixed(3):'缺失')+'</td><td>'+(m?(100*m.low_cell_fraction).toFixed(1)+'%':'缺失')+'</td><td>'+(m?m.FK_D3_q95.toFixed(2):'缺失')+'</td></tr>';$('summary').innerHTML=html+'</table>';$('evidence').textContent=JSON.stringify({source_interval:item.source_interval,source_holds:item.source_holds,original_low_runs:item.sourceMetrics.low_runs,candidate_low_runs:chosen?.metrics?.low_runs,G1_screen:chosen?.connection,status:chosen?.status,semantic_hold:'UNKNOWN'},null,2);$('jumps').replaceChildren();for(let r of chosen?.metrics?.low_runs||[]){let b=document.createElement('button');b.textContent='候选低活动 '+(r.cells_half_open[0]/30).toFixed(2)+'–'+(r.cells_half_open[1]/30).toFixed(2)+'s';b.onclick=()=>seek(r.cells_half_open[0]+(pair()?item.core_offset:0));$('jumps').append(b)}let c=$('warp').getContext('2d');c.clearRect(0,0,300,150);for(let [v,color] of [[baseline,'#a4afb8'],[chosen,'#6ed8db']]){if(!v?.q)continue;c.strokeStyle=color;c.beginPath();v.q.forEach((q,i)=>{let x=10+i/239*280,y=140-(q-item.source_interval[0])/Math.max(1,item.source_interval[1]-item.source_interval[0]-1)*130;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}}
function choose(){stop();chosen=item.variants[+$('candidate').value]||null;$('candidateTitle').textContent=chosen?.label||'完整来源模式';f=0;if(item.audio)audio.currentTime=offset()/30;summary();draw()}
function load(){stop();sourceRunning=false;item=D.items[+$('pick').value];sf=f=0;$('sourceSeek').max=item.sourceP.length-1;$('candidate').replaceChildren();item.variants.forEach((v,i)=>{let o=document.createElement('option');o.value=i;o.textContent=v.label+(v.P?'':' · 缺失');$('candidate').append(o)});baseline=item.variants.find(v=>v.label==='R69 E1W'||v.label==='E1W')||null;let def=item.variants.findIndex(v=>v.label==='GTW A_GTWLocal'||v.label==='HoldFirstMusicProxy');$('candidate').value=Math.max(0,def);audio.hidden=!item.audio;if(item.audio)audio.src=item.audio;else audio.removeAttribute('src');choose()}
$('pick').onchange=load;$('candidate').onchange=choose;$('mode').onchange=()=>seek(0);$('play').onclick=()=>{if(!item.audio)return;if(f>=nframes()-1)seek(0);audio.play()};$('pause').onclick=stop;$('prev').onclick=()=>seek(f-1);$('next').onclick=()=>seek(f+1);$('seek').oninput=e=>seek(+e.target.value);audio.onseeked=()=>{f=Math.min(nframes()-1,Math.max(0,Math.round(audio.currentTime*30)-offset()));draw()};$('sourcePlay').onclick=()=>{sourceRunning=!sourceRunning;if(sf>=item.sourceP.length-1)sf=0;sourceStart=performance.now()-sf/30*1000};$('sourceSeek').oninput=e=>{sourceRunning=false;sf=+e.target.value;draw()};
function tick(){if(!audio.paused){f=Math.max(0,Math.floor(audio.currentTime*30+1e-4)-offset());if(f>=nframes()-1){f=nframes()-1;stop()}}if(sourceRunning){sf=Math.floor((performance.now()-sourceStart)/1000*30);if(sf>=item.sourceP.length-1){sf=item.sourceP.length-1;sourceRunning=false}}draw();requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script>
