<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R63 固定音乐预算 · Core / Transition 对照</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#203b40;background:#eef2f3}*{box-sizing:border-box}body{margin:0 auto;max-width:1720px;padding:26px}header{margin-bottom:18px}h1{font-size:27px;margin:0 0 10px}h2{font-size:18px}.muted{color:#556d73;font-size:14px;line-height:1.6}#notice{background:#e1ece8;border-left:4px solid #347c67;padding:12px 16px;margin:16px 0}.toolbar{background:white;padding:15px;border-radius:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 8px #102f3810}button,select{font:inherit;border:1px solid #b5c6cb;border-radius:6px;padding:8px 12px;background:#fff;color:inherit}button:hover{background:#edf4f5}#case{max-width:100%;width:710px}#seek{flex:1;min-width:230px;accent-color:#267563}#clock{min-width:310px;font-variant-numeric:tabular-nums}#panels{display:grid;gap:14px;margin:18px 0}.panel{background:#fff;border-radius:12px;padding:14px;overflow:hidden}.panel h2{margin:0 0 6px}.panel canvas{display:block;width:100%;height:340px;background:#f8fafb;border-radius:8px}.status{font-size:13px;min-height:38px;line-height:1.5}.ok{color:#267563}.bad{color:#a13930}.bar{position:relative;height:29px;margin:10px 0 4px;display:flex;border:1px solid #cad7d9;border-radius:4px;overflow:hidden}.segment{display:flex;justify-content:center;align-items:center;overflow:hidden;font-size:11px;white-space:nowrap;background:#d7e9e5}.segment.gap{background:#f1d9b2}.cursor{position:absolute;top:0;bottom:0;width:2px;background:#9e2929}.frames{font-size:12px;color:#566e75;font-variant-numeric:tabular-nums}.legend{font-size:13px;margin:12px 0}.legend b{padding:4px 8px;border-radius:4px;background:#d7e9e5;margin-right:7px}.legend b:nth-child(2){background:#f1d9b2}details{background:#fff;border-radius:9px;padding:12px;margin-top:13px}summary{cursor:pointer}pre{font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:440px;overflow:auto}#error{color:#a13930}#evidence{font-size:11px;overflow-wrap:anywhere;margin:18px 0}audio{display:none}.audioOption{font-size:14px;display:flex;align-items:center;gap:6px}@media(max-width:700px){body{padding:12px}h1{font-size:22px}#panels{grid-template-columns:1fr!important}.panel canvas{height:320px}#clock{min-width:0}}
</style>
<header><h1>R63 · 相同 17.6 秒音乐，如何分配动作与过渡？</h1><div class="muted">真实保存的 528 帧动作同步播放。每个方案重新计算完整来源 Core 的 E1-W，再连接两端；改变过渡时长后，音乐总时长保持不变。</div></header>
<div id="notice">仅展示 Root-relative 身体 22 关节。可比较动作构形与连接；世界 Root、足部接触和 Native24 尚不可评价。失败方案保留空白，不使用其他结果替代。</div>
<div class="toolbar"><label for="case">来源对</label><select id="case"></select><span id="count" class="muted"></span></div>
<div class="toolbar" style="margin-top:10px"><button id="play">播放</button><button id="prev">前一帧</button><button id="next">后一帧</button><input id="seek" type="range" min="0" max="527" step="1" value="0" aria-label="共同音乐帧"><select id="rate" aria-label="共同播放倍速"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select><label class="audioOption"><input id="silent" type="checkbox">静音独立时钟</label><span id="clock"></span></div>
<audio id="masterAudio" preload="auto"></audio><div id="error" class="muted" role="status"></div>
<div class="legend"><b>来源 Core · 保留原数组</b><b>Geometry Transition · 生成区</b> 同一来源对采用共同固定相机与比例；无后处理平滑。</div>
<main id="panels"></main><details><summary>来源、真实时钟与数值详情</summary><pre id="details"></pre></details><div id="evidence"></div>
<script id="r63-data" type="application/json">__R63_PAYLOAD__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('r63-data').textContent),$=id=>document.getElementById(id),audio=$('masterAudio');
let current=null,coordinates=[],frame=0,playing=false,silentBase=0,silentStamp=0,scale=1,centerY=0,lastDraw=-1;
window.R63_EVIDENCE={schema:D.schema,fps:D.fps,frames:D.frames,case_count:D.cases.length,main_result_sha256:D.main_result_sha256,master:'audio.currentTime',rendered_frames:[],failed_panels_blank:true};
function decode(s){if(!s)return null;const raw=atob(s),b=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)b[i]=raw.charCodeAt(i);return new Float32Array(b.buffer)}
function pause(){playing=false;audio.pause();$('play').textContent='播放'}
function changeFrame(value){pause();frame=Math.max(0,Math.min(D.frames-1,Math.round(value)));audio.currentTime=frame/D.fps;silentBase=frame;lastDraw=-1;draw()}
function begin(){if(frame>=D.frames-1)changeFrame(0);if($('silent').checked){silentBase=frame;silentStamp=performance.now();playing=true;$('play').textContent='暂停'}else{audio.playbackRate=+$('rate').value;audio.play().then(()=>{playing=true;$('play').textContent='暂停';$('error').textContent=''}).catch(e=>{pause();$('error').textContent='音频暂不能播放：'+e.message+'。可显式选用静音独立时钟。'})}}
function setup(cv){const w=cv.clientWidth,h=cv.clientHeight,dpr=window.devicePixelRatio||1;if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);return[ctx,w,h]}
function projection(x,y,z,w,h){const yaw=-.48,px=Math.cos(yaw)*x+Math.sin(yaw)*z,pz=-Math.sin(yaw)*x+Math.cos(yaw)*z;return[w/2+px*scale,h*.53-(y-centerY)*scale+pz*scale*.17]}
function drawPanel(index){const p=current.panels[index],cv=$('canvas'+index),[ctx,w,h]=setup(cv),values=coordinates[index];ctx.fillStyle='#f8fafb';ctx.fillRect(0,0,w,h);if(!values){ctx.fillStyle='#963d35';ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText('失败 / 无合格轨迹',w/2,h*.46);ctx.fillStyle='#687c82';ctx.font='12px system-ui';ctx.fillText('保留空白 · 未替换为其他方案',w/2,h*.55);return}const offset=frame*22*3,points=[];for(let j=0;j<22;j++)points.push(projection(values[offset+j*3],values[offset+j*3+1],values[offset+j*3+2],w,h));ctx.strokeStyle='#e3e9eb';ctx.lineWidth=1;for(let i=-3;i<=3;i++){const[a,b]=[projection(i*.3,-.95,-.9,w,h),projection(i*.3,-.95,.9,w,h)];ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}ctx.lineWidth=3.5;ctx.lineCap='round';for(let j=1;j<22;j++){let k=D.parents[j];if(k<0||k>=22)continue;ctx.strokeStyle=[16,18,20].includes(j)?'#23669d':[17,19,21].includes(j)?'#b45d40':'#277665';ctx.beginPath();ctx.moveTo(...points[k]);ctx.lineTo(...points[j]);ctx.stroke()}for(let j=0;j<22;j++){ctx.beginPath();ctx.arc(...points[j],j===0?4:2.5,0,Math.PI*2);ctx.fillStyle='#294f58';ctx.fill()}$('cursor'+index).style.left=(frame/(D.frames-1)*100)+'%';const region=p.regions.find(r=>r.interval[0]<=frame&&frame<r.interval[1]);$('frame'+index).textContent='实际帧 '+frame+' / 527 · '+(region?region.kind:'UNKNOWN');}
function draw(){if(!current)return;frame=Math.max(0,Math.min(D.frames-1,Math.floor(frame)));if(frame===lastDraw)return;lastDraw=frame;$('seek').value=frame;const absolute=current.music_interval[0]+frame;$('clock').textContent='局部 '+frame+'/527 · '+(frame/D.fps).toFixed(3)+' s · 音乐绝对帧 '+absolute+' ('+(absolute/D.fps).toFixed(3)+' s)';current.panels.forEach((_,i)=>drawPanel(i));window.R63_EVIDENCE.current_case=current.key;window.R63_EVIDENCE.current_frame=frame;window.R63_EVIDENCE.rendered_frames=current.panels.map(p=>p.data?frame:null);window.R63_EVIDENCE.audio_time=audio.currentTime;window.R63_EVIDENCE.failed_panels_blank=current.panels.every((p,i)=>p.data!==null||coordinates[i]===null);}
function load(){pause();current=D.cases[+$('case').value];coordinates=current.panels.map(p=>decode(p.data));frame=0;lastDraw=-1;audio.src=current.audio.path;audio.load();$('error').textContent='';const bounds=current.panels.filter(p=>p.bounds).map(p=>p.bounds);let lo=Infinity,hi=-Infinity,extent=.5;for(const b of bounds){lo=Math.min(lo,b[0][1]);hi=Math.max(hi,b[1][1]);extent=Math.max(extent,Math.abs(b[0][0])+Math.abs(b[0][2])*.5,Math.abs(b[1][0])+Math.abs(b[1][2])*.5)}centerY=isFinite(lo)?(lo+hi)/2:0;const vertical=isFinite(lo)?hi-lo:2;scale=Math.min(240/Math.max(vertical,1),220/Math.max(extent*2,1));$('panels').replaceChildren();$('panels').style.gridTemplateColumns='repeat('+Math.min(current.panels.length,3)+',minmax(0,1fr))';current.panels.forEach((p,i)=>{const article=document.createElement('article');article.className='panel';const title=document.createElement('h2');title.textContent=p.name;const status=document.createElement('div');status.className='status '+(p.accepted?'ok':'bad');status.textContent=p.data?'G1 原数值门通过 · Core '+p.allocation.left_frames+' + 过渡 '+p.gap_frames+' + Core '+p.allocation.right_frames+' = 528 帧':p.status+' · '+(p.reason||'无合格输出');if(p.method==='G0'&&p.data)status.textContent=status.textContent.replace('G1','G0');const canvas=document.createElement('canvas');canvas.id='canvas'+i;canvas.setAttribute('aria-label',p.name+'实际动作');const bar=document.createElement('div');bar.className='bar';for(const r of p.regions){const span=document.createElement('span');span.className='segment '+(r.kind==='TRANSITION'?'gap':'');span.style.width=((r.interval[1]-r.interval[0])/D.frames*100)+'%';span.textContent=r.interval[0]+'–'+r.interval[1];span.title=r.kind+' ['+r.interval.join(',')+')';bar.append(span)}const cursor=document.createElement('span');cursor.className='cursor';cursor.id='cursor'+i;bar.append(cursor);const frames=document.createElement('div');frames.className='frames';frames.id='frame'+i;article.append(title,status,canvas,bar,frames);$('panels').append(article)});$('details').textContent=JSON.stringify({case:current.key,role:current.role,source_pair:current.source_pair,music:current.music_name,music_interval:current.music_interval,audio:current.audio,exposure:current.exposure,panels:current.panels.map(({data,bounds,...p})=>p)},null,2);$('count').textContent=(+$('case').value+1)+' / '+D.cases.length+' · '+current.role;draw()}
for(const[c,i]of D.cases.map((c,i)=>[c,i])){const o=document.createElement('option');o.value=i;o.textContent=c.role+' '+String(i+1).padStart(2,'0')+' · '+c.source_pair.left.source_uid+' → '+c.source_pair.right.source_uid+' · '+c.music_name;$('case').append(o)}
$('case').addEventListener('change',load);$('play').addEventListener('click',()=>playing?pause():begin());$('prev').addEventListener('click',()=>changeFrame(frame-1));$('next').addEventListener('click',()=>changeFrame(frame+1));$('seek').addEventListener('input',()=>changeFrame(+$('seek').value));$('rate').addEventListener('change',()=>{if($('silent').checked){silentBase=frame;silentStamp=performance.now()}audio.playbackRate=+$('rate').value});$('silent').addEventListener('change',()=>{pause();changeFrame(frame)});audio.addEventListener('ended',()=>{pause();frame=D.frames-1;lastDraw=-1;draw()});audio.addEventListener('error',()=>{$('error').textContent='音乐读取失败；未自动改用静音时钟。可显式勾选静音独立时钟。'});window.addEventListener('resize',()=>{lastDraw=-1;draw()});document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();playing?pause():begin()}if(e.code==='ArrowLeft')changeFrame(frame-1);if(e.code==='ArrowRight')changeFrame(frame+1)});
$('evidence').textContent='FPS '+D.fps+' · T '+D.frames+' · 主结果 SHA256 '+D.main_result_sha256+' · '+D.view+' · 真实 FK，无显示滤波';function tick(now){if(playing){frame=$('silent').checked?Math.floor(silentBase+(now-silentStamp)/1000*D.fps*+$('rate').value):Math.floor(audio.currentTime*D.fps+1e-5);if(frame>=D.frames){frame=D.frames-1;pause()}draw()}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script></html>
