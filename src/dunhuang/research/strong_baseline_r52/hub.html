<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R52 · 规划与生成观看入口</title>
<style>body{margin:0;background:#f4f1e8;color:#173e36;font:16px system-ui}header{max-width:1400px;margin:auto;padding:24px 20px 8px}h1{margin:0 0 12px}button,select{font:inherit;padding:8px;border:1px solid #9caf9c;background:white;border-radius:6px}button[aria-selected=true]{background:#173e36;color:white}audio,input{width:100%}nav{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}iframe{display:block;width:100%;height:1080px;border:0}a{color:#176b59}#ack{font-size:13px}#status{padding:10px;background:#dfe9dc}small{display:block;margin:10px 0}</style>
<header><h1>R52 · 同一计划，查看规划与实际生成</h1><p>冻结 Heuristic＋E1-W＋几何编排。两组双事件开发片段，分别使用实际敦煌音乐；这不是整曲交付。生成净收益尚未建立，世界 Root／接触未知，Native24 不可评。</p>
<select id="fixture" aria-label="同一计划案例"></select><audio id="master" controls></audio>
<nav><button id="play">播放</button><button id="pause">暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="rate" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select><span id="clock"></span></nav>
<input id="seek" type="range" min="0" value="0" aria-label="统一音乐帧"><nav role="tablist"><button id="plan" role="tab">Module I · 编排计划预演</button><button id="generated" role="tab">Module II · 实际生成对照</button></nav>
<p id="status"></p><p id="ack"></p><small><a href="plans/viewer/index.html">全部18组冻结规划</a> · <a href="main/viewer/index.html">单独打开生成对照</a> · <a href="plan_controls/viewer/index.html">匹配预算规划对照</a> · <a href="music_controls/viewer/index.html">匿名音乐对照准备</a> · <a href="controls/viewer/index.html">生成条件干预</a> · <a href="no_phase/viewer/index.html">无Phase同预算训练</a></small></header>
<iframe id="display" title="当前阶段的真实动作"></iframe><script src="hubdata.js"></script><script>
const $=x=>document.getElementById(x),audio=$('master');let item,frame=0,mode='generated',ready=false;
R52HUB.forEach((r,i)=>$('fixture').add(new Option(r.label,i)));
function send(){if(ready)$('display').contentWindow.postMessage({type:'R52_CLOCK',index:mode==='plan'?item.plan_index:item.generation_index,frame},'*')}
function show(){frame=Math.max(0,Math.min(item.frames-1,Math.round(audio.currentTime*30)));$('seek').value=frame;$('clock').textContent='局部 '+frame+' · 音乐全局 '+(item.origin+frame)+' / '+(item.origin+item.frames-1)+' 帧';send()}
function stage(next){audio.pause();mode=next;ready=false;$('plan').setAttribute('aria-selected',mode==='plan');$('generated').setAttribute('aria-selected',mode==='generated');$('display').src=(mode==='plan'?'plans':'main')+'/viewer/index.html?embedded=1';$('status').textContent=mode==='plan'?'编排计划预演：完整所选来源Core重定时＋几何Bridge，连接区有明确标识。':'实际生成：来源＋几何Bridge／冻结神经模型／本轮240步适配；三栏使用同一帧。'}
function load(){audio.pause();item=R52HUB[+$('fixture').value];frame=0;audio.src=item.audio;audio.playbackRate=+$('rate').value;$('seek').max=item.frames-1;stage(mode);show()}
function seek(t){audio.pause();frame=Math.max(0,Math.min(item.frames-1,t));audio.currentTime=frame/30;show()}
window.addEventListener('message',e=>{if(e.source!==$('display').contentWindow)return;if(e.data?.type==='R52_READY'){ready=true;send()}if(e.data?.type==='R52_FRAME_ACK')$('ack').textContent='画面已显示：局部 '+e.data.frame+' 帧；'+(mode==='plan'?'冻结计划':'实际生成')});
$('display').onload=()=>{ready=true;send()};$('fixture').onchange=load;$('plan').onclick=()=>stage('plan');$('generated').onclick=()=>stage('generated');$('play').onclick=()=>audio.play();$('pause').onclick=()=>audio.pause();$('prev').onclick=()=>seek(frame-1);$('next').onclick=()=>seek(frame+1);$('seek').oninput=()=>seek(+$('seek').value);$('rate').onchange=()=>{audio.defaultPlaybackRate=+$('rate').value;audio.playbackRate=+$('rate').value};audio.onloadedmetadata=()=>{audio.playbackRate=+$('rate').value;audio.currentTime=frame/30};audio.onseeked=show;function tick(){if(!audio.paused)show();requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script></html>
