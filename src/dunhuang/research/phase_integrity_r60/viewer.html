<!doctype html><html lang="zh"><meta charset="utf-8"><title>R60 阶段支持与切分对照</title>
<style>body{margin:24px;background:#f5f1e8;color:#173e36;font:16px system-ui}h1{font-size:25px}button,select,input{font:inherit;margin:4px;padding:7px;border:1px solid #a8b9ae;border-radius:6px}canvas{background:white;border-radius:12px;width:100%;height:440px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}#bar{height:66px}#seek{width:65%}details{background:white;padding:12px;margin-top:16px}#state{font-variant-numeric:tabular-nums}.note{font-size:14px;color:#645b49}</style>
<h1>R60 · 连续来源、R47 保护边界与同长度截断对照</h1>
<p>原速 30 FPS、共同来源时间轴。灰色姿态仅为区间外上下文。旧499切口用红线标示；保护带是运动学代理，不代表已验证的舞蹈语义。</p>
<select id="cases"></select><button id="play">播放</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
<input id="seek" type="range" min="0" value="0" step="1"><span id="state"></span>
<div class="row"><div><h3>连续来源＋真实上下文</h3><canvas id="source"></canvas></div><div><h3>A4 · R47 阶段支持保护</h3><canvas id="a4"></canvas></div><div><h3>A5 · 移动切口，帧数相同</h3><canvas id="a5"></canvas></div></div>
<canvas id="bar"></canvas><p class="note">色带：绿色 A4、棕色 A5、浅紫运动学保护区、红线旧事件边界。点击时间线可跳转。仅展示 Root-relative 身体22关节；未知世界 Root／接触不能据此判合格。本页无音频，不用于判断音乐匹配；也不是新动作生成。</p>
<a href="../video/index.html">观看视频</a><details><summary>来源身份、真实帧区间与配对证据</summary><pre id="details"></pre></details>
<script src="data.js"></script><script>
const $=id=>document.getElementById(id), cs=R60.cases, par=R60.parents;let c,P,f=0,running=false,last=0,carry=0;
cs.forEach((x,i)=>$('cases').add(new Option(x.dataset+' · '+x.source_uid+' · '+x.role,i)));
function load(){c=cs[+$('cases').value];P=new Float32Array(Uint8Array.from(atob(c.data),x=>x.charCodeAt(0)).buffer);f=0;carry=0;$('seek').max=c.frames-1;let m={...c};delete m.data;$('details').textContent=JSON.stringify(m,null,2);draw();}
function setup(id){let el=$(id),w=el.clientWidth,h=el.clientHeight;el.width=w*devicePixelRatio;el.height=h*devicePixelRatio;let g=el.getContext('2d');g.scale(devicePixelRatio,devicePixelRatio);g.clearRect(0,0,w,h);return [g,w,h]}
function draw(){f=Math.max(0,Math.min(c.frames-1,f));let actual=c.origin+f;$('seek').value=f;$('state').textContent='来源帧 '+actual+' · '+(actual/30).toFixed(3)+' 秒 · 局部帧 '+f+'/'+(c.frames-1);let ymin=1e9,ymax=-1e9,xmax=0;for(let i=0;i<P.length;i+=3){ymin=Math.min(ymin,P[i+1]);ymax=Math.max(ymax,P[i+1]);xmax=Math.max(xmax,Math.abs(.94*P[i]-.342*P[i+2]));}
['source','a4','a5'].forEach((id,k)=>{let[g,w,h]=setup(id),scale=Math.min((h-70)/(ymax-ymin||1),(w-45)/(2*xmax||1))*.93,active=k===0||(c[k===1?'A4':'A5'][0]<=actual&&actual<c[k===1?'A4':'A5'][1]);let xy=j=>{let i=(f*22+j)*3;return [w/2+scale*(.94*P[i]-.342*P[i+2]),h/2-scale*(P[i+1]-(ymin+ymax)/2)]};g.strokeStyle=active?'#177e70':'#d9d9d9';g.lineWidth=4;for(let j=1;j<22;j++){g.beginPath();g.moveTo(...xy(par[j]));g.lineTo(...xy(j));g.stroke()}g.fillStyle=active?'#173e36':'#9c786a';g.fillText(active?'真实来源观测':'区间外上下文（非候选动作）',12,h-18)});
let[g,w,h]=setup('bar'),x=t=>(t-c.origin)/c.frames*w;c.protected.forEach(([a,b])=>{g.fillStyle='#e5deed';g.fillRect(x(a),0,x(b)-x(a),h)});[['A4','#177e70',12],['A5','#aa783b',34]].forEach(([k,col,y])=>{g.fillStyle=col;g.fillRect(x(c[k][0]),y,x(c[k][1])-x(c[k][0]),12)});g.strokeStyle='#c14c3c';c.legacy_cuts.forEach(t=>{g.beginPath();g.moveTo(x(t),0);g.lineTo(x(t),h);g.stroke()});g.strokeStyle='#111';g.beginPath();g.moveTo(x(actual),0);g.lineTo(x(actual),h);g.stroke();}
$('cases').onchange=()=>{running=false;$('play').textContent='播放';load()};$('play').onclick=()=>{running=!running;last=performance.now();$('play').textContent=running?'暂停':'播放'};$('seek').oninput=()=>{f=+$('seek').value;carry=0;draw()};$('prev').onclick=()=>{running=false;$('play').textContent='播放';f--;draw()};$('next').onclick=()=>{running=false;$('play').textContent='播放';f++;draw()};$('bar').onclick=e=>{f=Math.floor((e.clientX-$('bar').getBoundingClientRect().left)/$('bar').clientWidth*c.frames);carry=0;draw()};
function tick(t){if(running){carry+=(t-last)*.03*+$('speed').value;let n=Math.floor(carry);carry-=n;if(n){f+=n;if(f>=c.frames){f=c.frames-1;running=false;$('play').textContent='播放'}draw()}}last=t;requestAnimationFrame(tick)};load();requestAnimationFrame(tick);window.addEventListener('resize',draw);
</script></html>
