<!doctype html><html lang="zh-CN" translate="no"><meta charset="utf-8"><meta name="google" content="notranslate"><title>动作查看 V2</title>
<style>body{font:16px system-ui,sans-serif;max-width:940px;margin:16px auto;color:#202b3a}canvas{background:#f2f5f8;width:100%;height:auto;touch-action:none;border-radius:8px}button,input,select{font:inherit;margin:6px}#note{padding:8px;background:#fff5d9}#clock{font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;flex-wrap:wrap}input[type=range]{flex:1;min-width:160px}</style>
<p>任务：__TASK__。保持原始 30 FPS 逐帧数据。拖动可旋转视角；没有自动循环，也未平滑动作。</p>
<label>查看方式 <select id="space"><option value="world">含拟合 Root 位移：观察移动</option><option value="pose">固定 Root：仅查看姿态</option></select></label>
<p id="note">位移来自原动作拟合，尚未核验真实地面与接触；仅凭此画面不能判定物理滑步真值。</p>
<canvas width="900" height="500" aria-label="动作骨架"></canvas>
<div class="row"><button id="play">播放</button><input aria-label="动作帧" id="frame" type="range" min="0" value="0"><span id="clock"></span></div>
__AUDIO__
<script>
const motion=__DATA__,parents=__PARENTS__,canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const slider=document.querySelector('#frame'),button=document.querySelector('#play'),space=document.querySelector('#space'),audio=document.querySelector('audio');
const fps=30,total=motion.pose.length,last=total-1;
slider.max=String(last);
let frame=0,playing=false,started=0,startFrame=0,yaw=-.35,view=fit('world');
function fit(name){
 const points=motion[name].flat(),minimum=[0,1,2].map(i=>Math.min(...points.map(p=>p[i]))),maximum=[0,1,2].map(i=>Math.max(...points.map(p=>p[i])));
 const center=minimum.map((v,i)=>(v+maximum[i])/2);
 const radius=Math.max(.1,...points.map(p=>Math.hypot(...p.map((v,i)=>v-center[i]))));
 return {center,scale:210/radius};
}
function project(p){const x=p[0]-view.center[0],y=p[1]-view.center[1],z=p[2]-view.center[2];return [450+view.scale*(Math.cos(yaw)*x+Math.sin(yaw)*z),250-view.scale*y]}
function line(a,b,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}
function draw(){
 ctx.clearRect(0,0,900,500);
 const poses=motion[space.value];
 if(space.value==='world'){ctx.setLineDash([4,5]);for(let i=1;i<poses.length;i++)line(project(poses[i-1][0]),project(poses[i][0]),'#aab6c5',1);ctx.setLineDash([])}
 const pts=poses[frame].map(project);
 for(let j=1;j<pts.length;j++)line(pts[parents[j]],pts[j],j%2?'#235d9e':'#9e4d23',2.5);
 for(const p of pts){ctx.beginPath();ctx.arc(...p,2.8,0,2*Math.PI);ctx.fillStyle='#24364b';ctx.fill()}
 ctx.fillStyle='#69788a';ctx.font='13px sans-serif';ctx.fillText('固定视角 · 轨迹线仅为拟合 Root 路径',14,480);
 slider.value=String(frame);document.querySelector('#clock').textContent='第 '+(frame+1)+' / '+total+' 帧 · '+(frame/fps).toFixed(2)+' s';
 button.textContent=playing?'暂停':frame>=last?'重新播放':'播放';
}
function setFrame(value){frame=Math.max(0,Math.min(last,Math.floor(value)))}
button.onclick=()=>{
 if(playing||(audio&&!audio.paused)){playing=false;if(audio)audio.pause();return}
 if(frame>=last){frame=0;if(audio)audio.currentTime=0}
 startFrame=frame;started=performance.now();playing=true;
 if(audio)audio.play().catch(()=>{playing=false});
};
slider.oninput=()=>{playing=false;if(audio)audio.pause();setFrame(Number(slider.value));if(audio)audio.currentTime=frame/fps;draw()};
space.onchange=()=>{view=fit(space.value);document.querySelector('#note').textContent=space.value==='world'?'位移来自原动作拟合，尚未核验真实地面与接触；仅凭此画面不能判定物理滑步真值。':'当前逐帧固定 Root，足部相对身体的移动不能用于判断世界坐标中的滑步。';draw()};
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(e.buttons){yaw+=e.movementX*.01;draw()}};
if(audio){audio.onplay=()=>playing=true;audio.onpause=()=>playing=false;audio.onended=()=>{playing=false;frame=last;draw()}}
function tick(now){
 if(audio){setFrame(audio.currentTime*fps);if(audio.ended){playing=false;frame=last}}
 else if(playing){setFrame(startFrame+(now-started)*fps/1000);if(frame>=last)playing=false}
 draw();requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script></html>
