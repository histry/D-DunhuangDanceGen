<!doctype html><meta charset="utf-8"><title>整曲音乐事件审计</title><style>body{background:#102132;color:#e4edf3;font:16px sans-serif;margin:22px}canvas{background:#152b3e;width:100%;cursor:crosshair}button,select,input{padding:7px;margin:5px}.warn{color:#edc278}pre{white-space:pre-wrap;font-size:13px}table{border-collapse:collapse}td,th{padding:7px;border:1px solid #567}a{color:#8cd8ff}</style>
<h1>整曲音乐事件 · 自动候选审计</h1><p class="warn">Beat／Downbeat是模型预测；Accent是声学候选；段落标签不是敦煌语义，乐句候选不是真值。模型一致性不等于准确率，所有结果尚未取得Planner选路资格。</p>
<select id="track"></select><audio id="audio" controls></audio><button id="play">播放整曲</button><button id="pause">暂停</button><button id="prev">前1/30秒</button><button id="next">后1/30秒</button><select id="zoom"><option value="0">整曲时间线</option><option value="20">20秒窗口</option><option value="8">8秒窗口</option></select><select id="clicks"><option value="">不叠加点击声</option><option value="beat_this:beat">Beat This 普通拍</option><option value="beat_this:downbeat">Beat This 强拍</option><option value="allin1:beat">All-In-One 普通拍</option><option value="allin1:downbeat">All-In-One 强拍</option><option value="acoustic:accent_candidate">声学重音候选</option></select><span id="clock"></span>
<p>点击时间线可跳转；窗口围绕当前音乐位置移动。事件保留原秒数，显示帧不会反向修改事件。</p><canvas id="timeline" width="1500" height="530"></canvas><div id="summary"></div>
<details><summary>抽样复核入口（尚无人工记录）</summary><p>先听整曲，再检查模型分歧片段。这里看到候选后的反馈属于复核，不自动成为独立准确率真值。</p><label>本人复核编号<input id="reviewer"></label><label>事件秒数<input id="seconds" type="number" step="0.001"></label><select id="kind"><option>beat</option><option>downbeat</option><option>accent</option><option>phrase_boundary</option><option>section_boundary</option></select><select id="judgment"><option>UNSURE</option><option>CONFIRMED_BY_LISTENING</option><option>REJECTED_BY_LISTENING</option></select><button id="mark">保存本人复核点</button><button id="export">下载实际记录</button><pre id="records"></pre></details>
<details><summary>事件证据、时钟和模型一致性</summary><pre id="details"></pre></details><script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=x=>document.getElementById(x),a=$('audio'),canvas=$('timeline'),c=canvas.getContext('2d');let index=0,ctx=null,last=-1,review=[];
const lanes=[['beat_this','beat','#64d4ed'],['beat_this','downbeat','#fc9a78'],['allin1','beat','#87a9ff'],['allin1','downbeat','#f8b24c'],['R64','beat','#adb5bd'],['R64','accent_candidate','#b1b86b'],['acoustic','accent_candidate','#f4e778'],['acoustic','chroma_boundary_candidate','#6ed8a5'],['multi_cue','phrase_boundary_candidate','#ee9bd1'],['allin1','section_boundary','#d1a2ff']];
D.tracks.forEach((t,i)=>{let o=document.createElement('option');o.value=i;o.textContent=t.name;$('track').append(o)});
function draw(){let t=D.tracks[index],zoom=+$('zoom').value,span=zoom||t.duration,start=zoom?Math.max(0,Math.min(t.duration-span,a.currentTime-span/2)):0,left=210,width=1260; c.clearRect(0,0,1500,530);c.font='14px sans-serif';c.fillStyle='#e2edf2';for(let j=0;j<=8;j++){let s=start+span*j/8;c.fillText(s.toFixed(2)+'s',left+width*j/8,20)}let energy=t.curves.acoustic_energy,max=Math.max(...energy,1e-9);c.strokeStyle='#84b7bf';c.beginPath();for(let i=0;i<energy.length;i++){let s=i/30;if(s<start||s>start+span)continue;let x=left+(s-start)/span*width,y=85-energy[i]/max*50;c.lineTo(x,y)}c.stroke();lanes.forEach((lane,i)=>{let y=112+i*35;c.fillStyle=lane[2];c.fillText(lane[0]+' '+lane[1],2,y+14);c.fillStyle='#294357';c.fillRect(left,y,width,1);c.fillStyle=lane[2];for(let e of t.events)if(e.source===lane[0]&&e.kind===lane[1]&&e.seconds>=start&&e.seconds<=start+span){let x=left+(e.seconds-start)/span*width;c.fillRect(x,y-3,2,23)}});c.strokeStyle='#fff';let x=left+(a.currentTime-start)/span*width;c.beginPath();c.moveTo(x,26);c.lineTo(x,478);c.stroke();$('clock').textContent=a.currentTime.toFixed(3)+'s · 30FPS位置 '+(30*a.currentTime).toFixed(3);canvas.dataset.start=start;canvas.dataset.span=span}
function load(){a.pause();index=+$('track').value;let t=D.tracks[index];a.src=t.audio;last=-1;$('details').textContent=JSON.stringify({audio_sha256:t.sha,duration_seconds:t.duration,comparison:t.comparison,segments:t.segments},null,2);$('summary').textContent='模型一致性（非准确率）：Beat '+JSON.stringify(t.comparison.beat_this_vs_allin1_beat.symmetric_matched_fraction)+' · Downbeat '+JSON.stringify(t.comparison.beat_this_vs_allin1_downbeat.symmetric_matched_fraction)+' · 乐句：'+t.phrase_status;draw()}
$('track').onchange=load;$('play').onclick=()=>{a.play();if(!ctx)ctx=new AudioContext();ctx.resume()};$('pause').onclick=()=>a.pause();$('prev').onclick=()=>{a.pause();a.currentTime=Math.max(0,a.currentTime-1/30)};$('next').onclick=()=>{a.pause();a.currentTime=Math.min(D.tracks[index].duration,a.currentTime+1/30)};$('zoom').onchange=draw;a.onseeked=()=>{last=a.currentTime;draw()};canvas.onclick=e=>{let rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*1500/rect.width;let t=+canvas.dataset.start+(x-210)/1260*(+canvas.dataset.span);a.currentTime=Math.max(0,Math.min(D.tracks[index].duration,t))};
function click(){if(!a.paused&&ctx&&$('clicks').value){let [model,kind]=$('clicks').value.split(':'),now=a.currentTime;for(let e of D.tracks[index].events)if(e.source===model&&e.kind===kind&&e.seconds>last&&e.seconds<=now){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=kind==='downbeat'?1100:750;g.gain.setValueAtTime(.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.035);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.04)}last=now}else last=a.currentTime;draw();requestAnimationFrame(click)}
$('mark').onclick=()=>{let s=+$('seconds').value,t=D.tracks[index];if(!$('reviewer').value.trim()||!$('seconds').value||s<0||s>=t.duration){$('records').textContent='需要实际复核人编号与音频支持内的秒数';return}review.push({track:t.name,audio_sha256:t.sha,seconds:s,kind:$('kind').value,judgment:$('judgment').value,reviewer_id:$('reviewer').value.trim(),exposure:'AUTOMATIC_CANDIDATES_VISIBLE_NOT_BLIND_GROUND_TRUTH'});$('records').textContent=JSON.stringify(review,null,2)};$('export').onclick=()=>{if(!review.length){$('records').textContent='没有实际记录，不生成标签';return}let d={schema:'MUSIC_EVENT_REVIEW_V1',records:review,independent_accuracy_reference:false};let link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));link.download='actual_music_reviews.json';link.click();URL.revokeObjectURL(link.href)};load();requestAnimationFrame(click);
</script>
