<!doctype html><meta charset="utf-8"><title>R73 补偿位置与实际运动</title><style>body{background:#102132;color:#e2edf2;font:16px sans-serif;margin:20px}section{display:flex;flex-wrap:wrap;gap:12px}article{width:300px}canvas{width:100%;background:#152b3e}button,select,input{margin:7px;padding:6px}.warn{color:#f3bf6a}pre{white-space:pre-wrap;font-size:12px}#native{width:300px}summary{cursor:pointer}</style>
<h1>R73 · 相同目标下的时间补偿</h1><p>真实ChangE来源，240帧Core＋48帧G1＋240帧相邻Core。高／低活动是运动学代理，不是舞蹈语义。未匹配及拒绝案例保留；D3变化不直接等于质量变化。</p>
<select id="case"></select><span id="status" class="warn"></span><br><audio id="audio" controls></audio><button id="play">共同播放</button><button id="pause">暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="rate"><option>1</option><option>0.5</option></select><input id="seek" type="range" min="0" max="527" value="0"><span id="clock"></span>
<section id="panels"></section><p>每栏底部：蓝=Core，橙=48帧Bridge，红=该方法实际输出时钟的补偿区，白线=当前帧。时钟曲线显示原来源帧，不把插值帧数当作完整性证据。</p>
<details><summary>原始来源独立原速播放（静音30FPS）</summary><button id="nativeplay">原速播放</button><button id="nativestop">原速暂停</button><span id="nativeclock"></span><br><canvas id="native" width="300" height="360"></canvas></details>
<details><summary>匹配预算与实际峰证据</summary><pre id="details"></pre></details><p class="warn">所有视图均为Root-relative身体22关节；世界Root、接触及Native24未验证。艺术质量与独立自然性偏好待真实评价。R74未启动。</p>
<script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.querySelector('#data').textContent),$=s=>document.getElementById(s),a=$('audio');let selected=0,frame=0,views=[],nativeFrame=0,nativeOn=false,nativeBase=0;
D.cases.forEach((v,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${i+1} · ${v.source_uid} · ${v.delta>0?'+':''}${v.delta}帧 · ${v.status}`;$('case').append(o)});
function pose(c,P,f,w=300,h=360){c.clearRect(0,0,w,h);if(!P){c.fillStyle='#ffd27c';c.fillText('未构成完整连接',60,170);return}let p=P[Math.min(P.length-1,Math.max(0,f))].map(v=>[w/2+115*(v[0]+.35*v[2]),180-115*(v[1]-.15*v[2])]);c.strokeStyle='#88dcc8';c.lineWidth=2;for(let j=1;j<22;j++){c.beginPath();c.moveTo(...p[D.parents[j]]);c.lineTo(...p[j]);c.stroke()}}
function draw(f){frame=Math.max(0,Math.min(527,f));$('seek').value=frame;$('clock').textContent=`${frame}/527 · ${(frame/30).toFixed(3)}秒`;let item=D.cases[selected];for(let v of views){pose(v.c,v.v.P,frame);let c=v.c;c.fillStyle='#287ba5';c.fillRect(0,338,300,7);c.fillStyle='#b17b31';c.fillRect(240/528*300,338,48/528*300,7);c.fillStyle='#ef6671';v.v.compensation_mask.forEach((x,i)=>{if(x)c.fillRect((i+item.core_start)/528*300,348,1,6)});c.fillStyle='#fff';c.fillRect(frame/528*300,334,1,23);let q=v.v.q;c.strokeStyle='#bd99ee';c.beginPath();for(let i=0;i<240;i++){let x=i/239*300,y=390-30*(q[i]-q[0])/(q[239]-q[0]);i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}}
function nativeDraw(){let c=$('native').getContext('2d'),n=D.cases[selected].native;pose(c,n,nativeFrame);$('nativeclock').textContent=`原来源 ${nativeFrame}/${n.length-1} 帧`}
function load(){a.pause();nativeOn=false;selected=+$('case').value;let item=D.cases[selected];a.src=item.audio;$('status').textContent=item.status==='MATCHED_HIGH_LOW'?'高/低活动区通过登记匹配门；分散方案另看证据':'未形成主比较，仅供诊断观看';$('panels').innerHTML='';views=item.variants.map(v=>{let t=document.createElement('article');t.innerHTML=`<h3>${v.method}</h3><p>G1：${v.G1?'原数值门通过':'拒绝'} · 峰：${v.actual_peak??'基线'} · 主匹配：${v.match?.eligible??'基线'}</p><canvas width="300" height="400"></canvas>`;$('panels').append(t);return {v,c:t.querySelector('canvas').getContext('2d')}});$('details').textContent=JSON.stringify({source:item.source_interval,match:item.primary_match,methods:item.variants.map(v=>({method:v.method,match:v.match,actual_peak:v.actual_peak,mapped_anchor:v.mapped_anchor}))},null,2);nativeFrame=0;nativeDraw();draw(0)}
function seek(f){a.pause();draw(f);a.currentTime=frame/30}$('case').onchange=load;$('play').onclick=()=>a.play();$('pause').onclick=()=>a.pause();$('prev').onclick=()=>seek(frame-1);$('next').onclick=()=>seek(frame+1);$('seek').oninput=e=>seek(+e.target.value);$('rate').onchange=e=>a.playbackRate=+e.target.value;a.onseeked=()=>draw(Math.floor(a.currentTime*30+1e-4));$('nativeplay').onclick=()=>{nativeOn=true;nativeBase=performance.now()-nativeFrame/30*1000};$('nativestop').onclick=()=>nativeOn=false;
function tick(){if(!a.paused)draw(Math.floor(a.currentTime*30+1e-4));if(nativeOn){let n=D.cases[selected].native;nativeFrame=Math.min(n.length-1,Math.floor((performance.now()-nativeBase)/1000*30));nativeDraw();if(nativeFrame===n.length-1)nativeOn=false}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script>
