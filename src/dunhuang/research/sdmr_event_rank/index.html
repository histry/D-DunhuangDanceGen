<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>SDMR-E2 真实事件检索</title><link rel="stylesheet" href="style.css"><body><main><small>DUNHUANG · FROZEN R41</small><h1>音乐查询与真实事件候选</h1><p class="note">真实来源可视化，不是生成舞蹈。时钟正负只说明配对录制时间，不代表艺术适合性。子窗口继承Parent Event，不冒充完整语义动作；模型保持Shadow。</p><p id="summary"></p><label>查询 <select id="case"></select></label><label>排序 <select id="method"></select></label><button id="play">播放 / 暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><label>倍速 <select id="rate"><option>1</option><option>0.5</option><option>0.25</option></select></label><p id="clock"></p><input id="scrub" type="range" value="0"><audio id="audio" controls></audio><section><article><h2>查询真实配对动作</h2><canvas id="query" width="480" height="390"></canvas></article><article><h2 id="candidateTitle">候选动作</h2><canvas id="candidate" width="480" height="390"></canvas></article></section><p>两栏按同长度音乐槽播放原动作；路径仅评分与诊断，未偷偷改变候选播放时钟。</p><div class="table"><table><thead><tr><th>候选来源</th><th>物理时钟关系</th><th>当前分数</th><th>有效覆盖</th></tr></thead><tbody id="rows"></tbody></table></div><h2>有效局部内容与严格部分路径</h2><canvas id="heatmap" width="600" height="250"></canvas><details><summary>来源、时间、Parent Event与评分详情</summary><pre id="details"></pre></details></main><script src="data.js"></script><script src="viewer.js"></script></body></html>
