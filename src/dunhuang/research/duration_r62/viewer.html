<!doctype html><html lang="zh"><meta charset="utf-8"><title>R62 过渡时长诊断</title>
<style>body{max-width:1600px;margin:24px auto;padding:12px;background:#f4f1e8;color:#173e36;font:16px system-ui}button,select{padding:7px;margin:4px;font:inherit}#seek{width:65%}#panels{display:grid;gap:10px}article{background:white;border-radius:10px;padding:12px}canvas{width:100%;height:300px}.mask{height:36px}#scope{background:#dfe9dc;padding:12px}pre{font-size:12px;white-space:pre-wrap}small{display:block}a{color:#175b70}</style>
<h1>R62 · 过渡时长、真实目标与固定来源连接</h1><p>身体22关节、局部Root视角；世界Root／接触未知，非Native24物理合格结论。短时长结束后不拉伸、不冻结末帧。</p>
<select id="case" aria-label="案例"></select><button id="play">播放</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="rate" aria-label="倍速"><option value=".5">0.5×</option><option value="1" selected>1×</option></select><button id="jump">跳到编辑开始</button>
<p><input id="seek" aria-label="共同帧时钟" type="range" min="0" value="0" step="1"><span id="clock"></span></p><p id="scope"></p><section id="panels"></section><p>蓝条＝真实边缘观测；棕条＝实际重建／插入区。每栏下方显示自身帧号和编辑范围。没有隐藏真值的跨来源连接不显示重建误差。</p><details><summary>身份、时钟和数值详情</summary><pre id="details"></pre></details>
<script src="data.js"></script><script>
const $=s=>document.getElementById(s);let c,B,f=0,playing=false,base=0,stamp=0,bounds;
R62.cases.forEach((r,i)=>$('case').add(new Option(r.label,i)));
function setup(cv){let w=cv.clientWidth,h=cv.clientHeight;cv.width=w*devicePixelRatio;cv.height=h*devicePixelRatio;let g=cv.getContext('2d');g.scale(devicePixelRatio,devicePixelRatio);return[g,w,h]}
function load(){pause();c=R62.cases[+$('case').value];B=c.panels.map(p=>p.data?new Float32Array(Uint8Array.from(atob(p.data),a=>a.charCodeAt(0)).buffer):null);let lo=1e9,hi=-1e9,xx=0;B.forEach(p=>{if(p)for(let k=0;k<p.length;k+=3){lo=Math.min(lo,p[k+1]);hi=Math.max(hi,p[k+1]);xx=Math.max(xx,Math.abs(.94*p[k]-.342*p[k+2]))}});bounds=[lo,hi,xx];$('panels').replaceChildren();$('panels').style.gridTemplateColumns='repeat('+Math.min(c.columns||c.panels.length,5)+',1fr)';c.panels.forEach((p,i)=>{let a=document.createElement('article'),h=document.createElement('h3'),cv=document.createElement('canvas'),mask=document.createElement('canvas'),s=document.createElement('small');h.textContent=p.name;cv.id='p'+i;mask.id='m'+i;mask.className='mask';s.id='s'+i;a.append(h,cv,mask,s);$('panels').append(a)});$('scope').textContent=c.scope;$('details').textContent=JSON.stringify(c.details,null,2);$('seek').max=c.frames-1;f=0;draw()}
function draw(){f=Math.max(0,Math.min(c.frames-1,f));let t=c.origin+f;$('seek').value=f;$('clock').textContent=(c.source_clock?'来源绝对帧 ':'连接经过帧 ')+t+' · '+(f/30).toFixed(3)+' 秒';let[lo,hi,xx]=bounds;
c.panels.forEach((p,i)=>{let[g,w,h]=setup($('p'+i)),idx=t-p.origin,data=B[i];g.fillStyle='#173e36';if(!data){g.fillText('构造失败：没有替代轨迹',10,h/2)}else if(idx<0||idx>=p.frames){g.fillText('不在本时长实际范围内',10,h/2)}else{let s=Math.min((h-35)/(hi-lo||1),(w-30)/(2*xx||1))*.9;let xy=j=>{let k=(idx*22+j)*3;return[w/2+s*(.94*data[k]-.342*data[k+2]),h/2-s*(data[k+1]-(lo+hi)/2)]};g.lineWidth=3;g.strokeStyle=p.truth?'#728376':'#177e70';for(let j=1;j<22;j++){g.beginPath();g.moveTo(...xy(R62.parents[j]));g.lineTo(...xy(j));g.stroke()}}
$('s'+i).textContent='局部帧 '+idx+' / '+p.frames+'；编辑 ['+p.edit.join(', ')+')';let[mg,mw,mh]=setup($('m'+i)),x=v=>(v-c.origin)/c.frames*mw;mg.fillStyle='#375c91';for(let[a,b]of[[p.origin,p.edit[0]],[p.edit[1],p.origin+p.frames]])mg.fillRect(x(a),0,(b-a)/c.frames*mw,10);mg.fillStyle='#bc8754';mg.fillRect(x(p.edit[0]),12,(p.edit[1]-p.edit[0])/c.frames*mw,10);mg.fillStyle='#111';mg.fillRect(x(t),0,1,mh)})}
function pause(){playing=false;$('play').textContent='播放'}$('case').onchange=load;$('seek').oninput=()=>{pause();f=+$('seek').value;draw()};$('prev').onclick=()=>{pause();f--;draw()};$('next').onclick=()=>{pause();f++;draw()};$('jump').onclick=()=>{pause();f=Math.min(...c.panels.map(p=>p.edit[0]))-c.origin;draw()};$('play').onclick=()=>{if(!playing&&f>=c.frames-1)f=0;playing=!playing;base=f;stamp=performance.now();$('play').textContent=playing?'暂停':'播放'};$('rate').onchange=()=>{base=f;stamp=performance.now()};function tick(t){if(playing){f=Math.floor(base+(t-stamp)*.03*+$('rate').value);if(f>=c.frames){f=c.frames-1;pause()}draw()}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script></html>
