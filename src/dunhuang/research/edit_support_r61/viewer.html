<!doctype html><html lang="zh"><meta charset="utf-8"><title>R61 来源裁剪与固定缺口</title><style>body{max-width:1450px;margin:24px auto;padding:12px;font:16px system-ui;background:#f4f1e8;color:#173e36}button,select{font:inherit;padding:7px;margin:4px}#seek{width:70%}#panels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}article{background:white;border-radius:10px;padding:12px}canvas{width:100%;height:350px}#bar{height:110px}pre{font-size:12px;white-space:pre-wrap}#note{background:#dfe9dc;padding:12px}#clock{font-variant-numeric:tabular-nums}</style><h1>R61 · 原始证据、真实裁剪与实际编辑范围</h1><p>保持原速与绝对来源时钟。自动阶段不是人工真值；Root-relative身体22关节，不代表完整物理合格。</p><select id="case"></select><button id="play">播放</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="rate"><option value=".5">0.5×</option><option value="1" selected>1×</option></select><button id="croponly">只播放A5有效段</button><button id="jump">跳到截断／缺口</button><p><input id="seek" type="range" min="0" value="0" step="1"><span id="clock"></span></p><p id="note"></p><section id="panels"></section><canvas id="bar"></canvas><p>蓝色=原始证据，浅紫=工程保护带，棕色=裁剪删除／实际编辑区，绿色=有效来源范围。灰色姿态只作区间外上下文，不是输出或补帧。较短A5按真实帧数结束。</p><details><summary>原始来源、干预和掩码详情</summary><pre id="details"></pre></details><script src="data.js"></script><script>
const $=s=>document.getElementById(s);let c,B,f=0,run=false,base=0,stamp=0,stop=0;R61.cases.forEach((r,i)=>$('case').add(new Option(r.label,i)));
function setup(id){let el=$(id),w=el.clientWidth,h=el.clientHeight;el.width=w*devicePixelRatio;el.height=h*devicePixelRatio;let g=el.getContext('2d');g.scale(devicePixelRatio,devicePixelRatio);return[g,w,h]}
function load(){run=false;$('play').textContent='播放';c=R61.cases[+$('case').value];B=c.methods.map(m=>new Float32Array(Uint8Array.from(atob(m.data),a=>a.charCodeAt(0)).buffer));$('panels').replaceChildren();c.methods.forEach((m,i)=>{let a=document.createElement('article'),h=document.createElement('h3'),cv=document.createElement('canvas');h.textContent=m.name;cv.id='p'+i;a.append(h,cv);$('panels').append(a)});$('note').textContent=c.scope;$('details').textContent=JSON.stringify(c.details,null,2);$('seek').max=c.frames-1;$('croponly').hidden=!c.A5;stop=c.frames;f=0;draw()}
function draw(){f=Math.max(0,Math.min(c.frames-1,f));let t=c.origin+f;$('seek').value=f;$('clock').textContent='来源帧 '+t+' · '+(t/30).toFixed(3)+' 秒 · 局部 '+f;let lo=1e9,hi=-1e9,xx=0;B.forEach(p=>{for(let k=0;k<p.length;k+=3){lo=Math.min(lo,p[k+1]);hi=Math.max(hi,p[k+1]);xx=Math.max(xx,Math.abs(.94*p[k]-.342*p[k+2]))}});let mid=(hi+lo)/2;
B.forEach((p,i)=>{let[g,w,h]=setup('p'+i),s=Math.min((h-60)/(hi-lo||1),(w-40)/(2*xx||1))*.9,m=c.methods[i],active=!m.interval||(m.interval[0]<=t&&t<m.interval[1]);g.lineWidth=3;g.strokeStyle=active?'#177e70':'#d3d3d3';let xy=j=>{let k=(f*22+j)*3;return[w/2+s*(.94*p[k]-.342*p[k+2]),h/2-s*(p[k+1]-mid)]};for(let j=1;j<22;j++){g.beginPath();g.moveTo(...xy(R61.parents[j]));g.lineTo(...xy(j));g.stroke()}g.fillStyle='#173e36';g.fillText(active?(m.generated?'实际几何补间／观测':'真实来源'):'已裁掉，仅作上下文',10,h-10)});
let[g,w,h]=setup('bar'),x=s=>(s-c.origin)/c.frames*w;for(let [span,y,col] of [[c.band,0,'#e5ddef'],[c.raw,20,'#375c91'],[c.A5,43,'#177e70'],[c.edit,67,'#bc8754']])if(span){g.fillStyle=col;g.fillRect(x(span[0]),y,x(span[1])-x(span[0]),16)}if(c.A5){g.fillStyle='#e8c5ae';g.fillRect(x(c.A5[1]),67,x(c.A4[1])-x(c.A5[1]),16)}g.fillStyle='#111';g.fillRect(x(t),0,1,h)}
function pause(){run=false;$('play').textContent='播放'}$('case').onchange=load;$('seek').oninput=()=>{pause();f=+$('seek').value;draw()};$('prev').onclick=()=>{pause();f--;draw()};$('next').onclick=()=>{pause();f++;draw()};$('jump').onclick=()=>{pause();f=(c.A5?c.A5[1]:c.edit[0])-c.origin;draw()};$('play').onclick=()=>{run=!run;stop=c.frames;base=f;stamp=performance.now();$('play').textContent=run?'暂停':'播放'};$('croponly').onclick=()=>{f=0;base=0;stop=c.A5[1]-c.origin;stamp=performance.now();run=true;$('play').textContent='暂停'};$('rate').onchange=()=>{base=f;stamp=performance.now()};$('bar').onclick=e=>{pause();f=Math.floor((e.clientX-$('bar').getBoundingClientRect().left)/$('bar').clientWidth*c.frames);draw()};function tick(t){if(run){f=Math.floor(base+(t-stamp)*.03*+$('rate').value);if(f>=stop){f=stop-1;pause()}draw()}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script></html>
