<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R51 规划与真实冻结采样</title>
<style>body{max-width:1400px;margin:24px auto;padding:18px;background:#f4f1e8;color:#173e36;font:17px system-ui}button,select{padding:8px;font:inherit}audio,input{width:100%}#panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}article{background:white;border-radius:12px;padding:12px}canvas{width:100%}h2{min-height:3em;font-size:20px}pre{white-space:pre-wrap;font-size:13px}#state{background:#dfe9dc;padding:12px}</style>
<h1>R51 · 同一时间轴上的真实效果</h1><p>规划比较 Top-4 与完整候选池；生成比较完整来源、几何基线与真实冻结 Lodge。来源阶段为观测运动学代理，世界 Root／接触及 Native24 尚未取得完整资格。</p>
<select id="case"></select><audio id="audio" controls></audio><p><button id="play">播放</button> <button id="pause">暂停</button> <button id="prev">前一帧</button> <button id="next">后一帧</button> <span id="clock"></span></p><input id="seek" type="range" min="0" value="0" aria-label="共同帧"><p id="state"></p><section id="panels"></section><details><summary>来源、条件与评价详情</summary><pre id="info"></pre></details>
<script src="data.js"></script><script>
const $=x=>document.getElementById(x),audio=$('audio');let row,frame=0,buffers=[],running=false,wall=0,base=0;
R51.cases.forEach((r,i)=>$('case').add(new Option(r.label,i)));
function load(){running=false;audio.pause();row=R51.cases[+$('case').value];buffers=row.methods.map(m=>new Float32Array(Uint8Array.from(atob(m.data),c=>c.charCodeAt(0)).buffer));$('panels').replaceChildren();row.methods.forEach((m,i)=>{const a=document.createElement('article'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=m.name;c.width=320;c.height=360;c.id='c'+i;a.append(h,c);$('panels').append(a)});audio.hidden=!row.audio;if(row.audio)audio.src=row.audio;else audio.removeAttribute('src');$('seek').max=row.frames-1;$('info').textContent=JSON.stringify(row.meta,null,2);show(0)}
function show(t){frame=Math.max(0,Math.min(row.frames-1,t));$('seek').value=frame;$('clock').textContent='局部 '+frame+' / '+(row.frames-1)+' · 音乐全局 '+(row.origin+frame)+' 帧';const region=row.meta.regions?.find(r=>r.interval[0]<=row.origin+frame&&row.origin+frame<r.interval[1]);$('state').textContent=row.meta.scope+'；当前 '+(region?.kind??(frame>=104&&frame<152?'可生成缺口':'外侧保护区'));buffers.forEach((p,i)=>{const c=$('c'+i),g=c.getContext('2d');g.clearRect(0,0,320,360);const xy=j=>{const k=(frame*22+j)*3;return[160+110*(.85*p[k]-.5*p[k+2]),175-110*p[k+1]]};for(let j=1;j<22;j++){g.lineWidth=3;g.strokeStyle=j%2?'#1f8070':'#b17b35';g.beginPath();g.moveTo(...xy(R51.parents[j]));g.lineTo(...xy(j));g.stroke()}})}
function pause(){running=false;audio.pause()}function seek(t){pause();show(t);if(row.audio)audio.currentTime=frame/30}
$('play').onclick=()=>{if(row.audio)audio.play();else{base=frame;wall=performance.now();running=true}};$('pause').onclick=pause;$('prev').onclick=()=>seek(frame-1);$('next').onclick=()=>seek(frame+1);$('seek').oninput=()=>seek(+$('seek').value);$('case').onchange=load;audio.onseeked=()=>row&&show(Math.round(audio.currentTime*30));function tick(){if(row.audio&&!audio.paused)show(Math.floor(audio.currentTime*30));if(!row.audio&&running){show(Math.floor(base+(performance.now()-wall)*.03));if(frame===row.frames-1)running=false}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script></html>
