<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P1 · 邻接上下文归因</title><style>body{font:15px system-ui;background:#f7f6f0;color:#23413f;margin:20px;max-width:1400px}button,select{padding:7px;margin:4px}canvas{width:100%;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.box{background:white;padding:12px;border-radius:12px}audio,#seek{width:98%}pre{white-space:pre-wrap;font-size:12px}#region{font-weight:bold}.warn{color:#9b4732}h1{font-size:24px}</style>
<h1>固定中心动作 · 邻居替换的实际G1结果</h1><p>全部14个失败组及14个预登记对照。两栏中心来源、旋转与Warp完全相同，仅改变左右邻居。红色失败是原数值门结果；局部恢复不代表整曲路径或艺术质量通过。</p><select id="case"></select><button id="play">共同播放</button><button id="pause">暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><label>倍速 <select id="rate"><option>.5</option><option selected>1</option></select></label><audio id="audio" controls></audio><input id="seek" type="range" min="0" step="1" value="0"><p id="clock"></p><p id="region"></p><p class="warn" id="status"></p><div class="grid"><section class="box"><h3>固定历史邻居</h3><p id="leftStatus"></p><canvas id="left" width="500" height="420"></canvas></section><section class="box"><h3>登记银行中的邻居替换见证</h3><p id="rightStatus"></p><canvas id="right" width="500" height="420"></canvas></section></div><details><summary>来源、左右边资格与实际Bridge哈希</summary><pre id="details"></pre></details><p id="error"></p>
<script src="data.js"></script><script>
const $=x=>document.getElementById(x);let D,row,L,R,frame=0,pending=null;function bytes(v){return Uint8Array.from(atob(v),x=>x.charCodeAt(0))}function decode(v){return v?new Float32Array(bytes(v).buffer):null}
function pose(id,P){const g=$(id).getContext('2d');g.clearRect(0,0,500,420);if(!P||!Number.isFinite(P[frame*66])){g.fillStyle='#9b4732';g.fillText('无合格替换见证／未构造，保持留空',30,50);return}const xy=j=>{let k=frame*66+j*3;return[250+140*(.85*P[k]-.5*P[k+2]),210-140*P[k+1]]};g.strokeStyle='#2c827c';g.lineWidth=3;for(let j=1;j<22;j++){g.beginPath();g.moveTo(...xy(j));g.lineTo(...xy(D.parents[j]));g.stroke()}g.fillStyle='#d08a45';for(let j=0;j<22;j++){g.beginPath();g.arc(...xy(j),3,0,7);g.fill()}}
function draw(){frame=Math.max(0,Math.min(row.frames-1,frame));$('seek').value=frame;$('clock').textContent=`局部 ${frame}/${row.frames-1} · 音乐全局 ${row.origin+frame} 帧 · ${((row.origin+frame)/30).toFixed(3)} 秒`;let a=row.meta.center_offset,b=a+row.meta.center_frames;$('region').textContent=frame>=a&&frame<b?'中心Core：两栏实际旋转逐位相同':frame>=a-48&&frame<a||frame>=b&&frame<b+48?'G1过渡区：显示实际构造；数值资格单列':'邻居Core：本轮允许改变';pose('left',L);pose('right',R)}
function seek(f){$('audio').pause();frame=f;pending=(row.origin+f)/30;if($('audio').readyState){$('audio').currentTime=pending;pending=null}draw()}
function choose(){row=D.items[+$('case').value];$('audio').pause();L=decode(row.left);R=decode(row.right);$('audio').src=row.audio;$('audio').playbackRate=+$('rate').value;$('seek').max=row.frames-1;$('leftStatus').textContent=row.meta.old_edges.map(e=>e.numeric?.passes_original_screen?'数值通过':'数值失败').join(' / ');$('rightStatus').textContent=row.meta.witness.recovered?row.meta.new_edges.map(e=>e.eligible?'策略及数值通过':'失败').join(' / '):'本登记域内无替换见证';$('status').textContent=`${row.meta.case.role}；${row.meta.witness.recovered?'存在局部见证，改变邻居数 '+row.meta.witness.changed_neighbors:'未恢复，失败保留'}；Native24与艺术质量不可评价`;$('details').textContent=JSON.stringify(row.meta,null,2);seek(0)}
$('case').onchange=choose;$('audio').onloadedmetadata=()=>{if(pending!==null){$('audio').currentTime=pending;pending=null}};$('audio').onseeked=()=>{frame=Math.round($('audio').currentTime*30)-row.origin;draw()};$('play').onclick=()=>$('audio').play().catch(e=>$('error').textContent=e.message);$('pause').onclick=()=>$('audio').pause();$('prev').onclick=()=>seek(frame-1);$('next').onclick=()=>seek(frame+1);$('seek').oninput=()=>seek(+$('seek').value);$('rate').onchange=()=>$('audio').playbackRate=+$('rate').value;
function tick(){if(row&&!$('audio').paused){frame=Math.floor($('audio').currentTime*30)-row.origin;if(frame>=row.frames){$('audio').pause();frame=row.frames-1}draw()}requestAnimationFrame(tick)}
(async()=>{let stream=new Blob([bytes(window.CTX)]).stream().pipeThrough(new DecompressionStream('gzip'));D=JSON.parse(await new Response(stream).text());D.items.forEach((r,i)=>$('case').add(new Option(r.label,i)));choose();requestAnimationFrame(tick)})().catch(e=>$('error').textContent=e.stack);
</script>
