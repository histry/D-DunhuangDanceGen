<!doctype html><meta charset="utf-8"><title>__TITLE__</title>
<style>body{background:#102132;color:#e2edf2;font:16px sans-serif;margin:20px}section{display:flex;flex-wrap:wrap;gap:14px}article{width:300px}canvas{width:300px;background:#152b3e}button,select,input{padding:7px;margin:5px}.warn{color:#efc784}pre{white-space:pre-wrap}details{margin:14px}</style>
<h1>__TITLE__</h1><p id="intro"></p><select id="pick"></select><span id="state"></span><br>
<div id="sound"></div><button id="play">共同播放</button><button id="pause">暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="rate"><option>1</option><option>0.5</option></select><input id="seek" type="range" min="0" max="527" value="0"><span id="clock"></span><section id="panels"></section>
<div id="review"></div><p class="warn">Root-relative身体22关节；世界Root、接触、Native24与独立质量增益未验证。原速来源与阶段标注另有独立入口。</p>
<script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let f=0,current=0,playing=false,base=0,speed=1,views=[],records={};
let audio=null;if(D.task!=='naturalness'){audio=document.createElement('audio');audio.controls=true;$('sound').append(audio)}
$('intro').textContent=D.intro;D.items.forEach((x,i)=>{let o=document.createElement('option');o.value=i;o.textContent=x.label;$('pick').append(o)});
function draw(frame){f=Math.max(0,Math.min(527,frame));$('seek').value=f;$('clock').textContent=`${f}/527 · ${(f/30).toFixed(3)}秒`;for(let v of views){let c=v.c;c.clearRect(0,0,300,390);if(!v.P){c.fillStyle='#ffd27c';c.fillText('无法执行／未替换',50,170);continue}let p=v.P[f].map(x=>[150+115*(x[0]+.35*x[2]),180-115*(x[1]-.15*x[2])]);c.strokeStyle='#88dcc8';c.lineWidth=2;for(let j=1;j<22;j++){c.beginPath();c.moveTo(...p[D.parents[j]]);c.lineTo(...p[j]);c.stroke()}c.fillStyle='#276b89';c.fillRect(0,345,300,6);c.fillStyle='#b78330';c.fillRect(240/528*300,345,48/528*300,6);c.fillStyle='#fff';c.fillRect(f/528*300,342,1,15)}}
function stop(){playing=false;if(audio)audio.pause()}
function load(){stop();current=+$('pick').value;let x=D.items[current];$('state').textContent=x.status||'';if(audio)audio.src=x.audio;$('panels').innerHTML='';views=x.variants.map(v=>{let t=document.createElement('article');let h=document.createElement('h3');h.textContent=v.label;t.append(h);let canvas=document.createElement('canvas');canvas.width=300;canvas.height=390;t.append(canvas);$('panels').append(t);return {c:canvas.getContext('2d'),P:v.P}});draw(0);if(D.anonymous){let r=records[x.id]||{choice:'MISSING',different:'MISSING'};$('choice').value=r.choice;$('different').value=r.different}}
$('pick').onchange=load;$('play').onclick=()=>{if(audio)audio.play();else{playing=true;base=performance.now()-f/30/speed*1000}};$('pause').onclick=stop;
function seek(n){stop();draw(n);if(audio)audio.currentTime=f/30}$('prev').onclick=()=>seek(f-1);$('next').onclick=()=>seek(f+1);$('seek').oninput=e=>seek(+e.target.value);$('rate').onchange=e=>{stop();speed=+e.target.value;if(audio)audio.playbackRate=speed};
if(audio)audio.onseeked=()=>draw(Math.floor(audio.currentTime*30+1e-4));
if(D.anonymous){$('review').innerHTML='<p>当前项目偏好 <select id="choice"><option>MISSING</option><option>A</option><option>B</option><option>TIE</option><option>UNSURE</option></select>实际运动明显不同？<select id="different"><option>MISSING</option><option>YES</option><option>NO</option><option>UNSURE</option></select></p><details><summary>导出本人实际记录（普通观看无需填写）</summary><label>评价者编号<input id="person"></label><label>独立名册引用<input id="roster"></label><label><input type="checkbox" id="own">本人独立判断</label><p>方法身份／历史具名结果／他人评价曝光，须分别声明：</p><select id="ex1"><option>UNSURE</option><option>NO</option><option>YES</option></select><select id="ex2"><option>UNSURE</option><option>NO</option><option>YES</option></select><select id="ex3"><option>UNSURE</option><option>NO</option><option>YES</option></select><button id="export">下载实际JSON</button><span id="message"></span></details>';
function save(){records[D.items[current].id]={id:D.items[current].id,choice:$('choice').value,different:$('different').value}}$('choice').onchange=save;$('different').onchange=save;
$('export').onclick=()=>{if(!$('person').value.trim()||!$('roster').value.trim()||!$('own').checked){$('message').textContent='实际科研导出需要本人编号、名册引用和独立判断声明';return}let doc={schema:'RETIME_PREF_V1',pack_id:D.pack_id,task:D.task,review_id:crypto.randomUUID(),reviewer_id:$('person').value.trim(),reviewer_roster_ref:$('roster').value.trim(),reviewed_at:new Date().toISOString(),independence:{own_judgment:true},exposure:{method_identity_seen:$('ex1').value,prior_named_results_seen:$('ex2').value,other_reviews_seen:$('ex3').value},items:Object.values(records)};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}));a.download=D.task+'_review.json';a.click();URL.revokeObjectURL(a.href)}}
function tick(){if(audio&&!audio.paused)draw(Math.floor(audio.currentTime*30+1e-4));if(playing){draw(Math.floor((performance.now()-base)/1000*30*speed));if(f===527)playing=false}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script>
