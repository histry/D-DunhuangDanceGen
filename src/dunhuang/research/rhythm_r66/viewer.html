<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>R66 原语内部节奏对照</title><style>
body{margin:0;background:#111924;color:#e3edf7;font:16px system-ui;padding:20px}h1{font-size:26px}p{max-width:1250px;line-height:1.6}.muted{color:#abc0d6}button,select,input{font:inherit;padding:8px;margin:4px;background:#22344b;color:white;border:1px solid #58728e;border-radius:5px}#panels{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:12px;margin-top:12px}canvas{width:100%;background:#192736;border:1px solid #40576e}.card h2{font-size:18px}.card p{font-size:14px;margin:4px 0}input[type=range]{width:48%}pre{white-space:pre-wrap;font-size:12px}details{margin-top:12px}h2{color:#8ee5cb}#status{color:#f3ce86}</style>
<h1>R66-B · 同一完整来源，固定 240 帧内部节奏</h1>
<p>比较来源匀速重定时、冻结 E1-W 与实验性 Rhythm Warp。三栏共用真实音乐时钟、相同来源区间、相同帧数与固定相机。这里改变的是播放时序，不是扩散模型生成的新动作。</p>
<p class="muted">12 个展示位置来自 8 个独特来源区间，含换音乐重复。阶段与拍点均为自动代理；代理分数变高只表示技术对齐变化。48 帧过渡未重新生成或验收，世界 Root、接触、Native24 与艺术质量均未评价。</p>
<select id="sample"></select><button id="play">共同播放</button><button id="pause">暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="rate"><option>1</option><option>0.5</option><option>0.25</option><option>1.5</option></select><br>
<input id="seek" type="range" min="0" max="239" value="0"><output id="frame"></output><span id="status"></span>
<div id="panels"></div><audio id="audio" preload="metadata"></audio><details><summary>来源身份、实际映射与诊断读数</summary><pre id="details"></pre></details>
<script>
const data=__DATA__, $=id=>document.getElementById(id),audio=$('audio');const labels={Uniform:'B0 · 匀速重定时',E1W:'B1 · 冻结 E1-W',Rhythm:'B2 · Rhythm Warp',ShuffledRhythm:'B3 · 错位音乐 Warp'};let item,views=[],at=0;
data.items.forEach((x,i)=>$('sample').add(new Option(x.source+' / '+x.music+' / '+x.key,i)));
function select(){audio.pause();item=data.items[+$('sample').value];audio.src=item.audio;at=0;$('panels').replaceChildren();views=[];$('panels').style.gridTemplateColumns='repeat('+Math.max(1,item.panels.length)+',minmax(240px,1fr))';for(const panel of item.panels){const card=document.createElement('div');card.className='card';const title=document.createElement('h2');title.textContent=labels[panel.method]||panel.method;const c=document.createElement('canvas');c.width=420;c.height=480;const p=document.createElement('p');card.append(title,c,p);$('panels').append(card);views.push({panel,c,ctx:c.getContext('2d'),p})}$('details').textContent=JSON.stringify({source:item.source,source_interval:item.source_interval,target_interval:item.target_interval,panels:item.panels.map(p=>({method:p.method,diagnostics:p.diagnostics}))},null,2);draw(0)}
function draw(f){at=Math.max(0,Math.min(239,f));for(const view of views){let {panel,ctx,p}=view;ctx.clearRect(0,0,420,480);if(!panel.P){ctx.fillStyle='#ffd49c';ctx.fillText(panel.status+' '+(panel.reason||''),10,100);p.textContent='未取得合法输出，保留该登记位置';continue}let P=panel.P[at];ctx.lineWidth=2.8;ctx.strokeStyle='#76decb';for(let j=1;j<22;j++){let a=P[j],b=P[data.parents[j]];ctx.beginPath();ctx.moveTo(210+a[0]*190,245-a[1]*190+a[2]*20);ctx.lineTo(210+b[0]*190,245-b[1]*190+b[2]*20);ctx.stroke()}ctx.font='13px system-ui';ctx.fillStyle='#dfeaf6';ctx.fillText('真实来源帧 '+panel.q[at].toFixed(2),12,22);let lineY=415;ctx.strokeStyle='#56718b';ctx.beginPath();ctx.moveTo(12,lineY);ctx.lineTo(408,lineY);ctx.stroke();for(let t of item.beats){ctx.fillStyle='#73aafa';ctx.fillRect(12+t/240*396,lineY-6,2,18)}for(let t of panel.phase_target_frames){ctx.fillStyle='#e6b35f';ctx.fillRect(12+t/240*396,lineY-24,3,14)}ctx.fillStyle='#fff';ctx.fillRect(12+at/240*396,lineY-30,2,54);ctx.fillText('蓝：音乐拍点  橙：来源运动峰代理',12,465);let d=panel.D3[Math.max(0,Math.min(panel.D3.length-1,at-2))];p.textContent='当前身体 D3 '+d.toFixed(2)+' m/s³ · 仅诊断，不据此判自然性'}$('seek').value=at;$('frame').textContent='输出帧 '+at+' · '+(at/30).toFixed(3)+' 秒';$('status').textContent=views.length+' 栏同一时钟'}
function jump(f){audio.pause();draw(f);audio.currentTime=at/30}
$('sample').onchange=select;$('play').onclick=()=>audio.play();$('pause').onclick=()=>{audio.pause();draw(Math.floor(audio.currentTime*30))};$('prev').onclick=()=>jump(at-1);$('next').onclick=()=>jump(at+1);$('seek').oninput=e=>jump(+e.target.value);$('rate').onchange=e=>audio.playbackRate=+e.target.value;audio.onended=()=>draw(239);function tick(){if(!audio.paused)draw(Math.floor(audio.currentTime*30));requestAnimationFrame(tick)}select();tick();
</script></html>
