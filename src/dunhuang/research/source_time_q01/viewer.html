<!doctype html><meta charset="utf-8"><title>来源×时间 · 固定可行性实验</title><style>body{background:#102132;color:#dfebf4;font:16px system-ui;margin:22px}button,select,input{padding:7px;margin:5px}section{display:flex;gap:15px;flex-wrap:wrap}article{width:310px}canvas{background:#142d40;width:300px}pre{white-space:pre-wrap}.warn{color:#efbd7a}a{color:#9dd}</style><h1>来源 × 时间 · 真实执行</h1><p id="intro"></p><select id="pick"></select><div><audio id="audio" controls></audio><button id="play">共同播放</button><button id="pause">暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><select id="rate"><option>1</option><option>0.5</option></select><input type="range" id="seek" min="0" value="0"><span id="clock"></span></div><p id="mode"></p><section id="panels"></section><details><summary>实际选择、资格与预算</summary><pre id="details"></pre></details><p class="warn">BAS／SDMR未参与决策；自动时间目标不等于艺术对应真值。Root-relative22关节，Native24不可评。</p><script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.getElementById('data').textContent),$=x=>document.getElementById(x);let i=0,f=0,playing=false,start=0,rate=1,views=[];const audio=$('audio');$('intro').textContent=D.intro;D.items.forEach((x,k)=>{let o=document.createElement('option');o.value=k;o.textContent=x.label;$('pick').append(o)});
function stop(){playing=false;audio.pause()}
function draw(n){let x=D.items[i];f=Math.max(0,Math.min(x.frames-1,n));$('seek').value=f;$('clock').textContent=`${f}/${x.frames-1} · ${(f/30).toFixed(3)}秒`;for(let v of views){let c=v.canvas.getContext('2d'),r=v.data;c.clearRect(0,0,300,440);let P=D.tracks[r.track],p=P?.[f];if(!p&&f<x.core)p=D.tracks[r.core_track]?.[f];if(p){let q=p.map(a=>[150+115*(a[0]+.35*a[2]),175-115*(a[1]-.15*a[2])]);c.strokeStyle=r.qualified===false?'#e6b66e':'#85dac9';c.lineWidth=2;for(let j=1;j<22;j++){c.beginPath();c.moveTo(...q[D.parents[j]]);c.lineTo(...q[j]);c.stroke()}}else{c.fillStyle='#efbd7a';c.fillText(x.raw?'原速来源实际播放已结束':'未构造有效完整片段；无替代动作',15,180)}c.fillStyle='#285472';c.fillRect(0,338,300,8);if(!x.raw){c.fillStyle='#ad7934';c.fillRect(x.core/x.frames*300,338,48/x.frames*300,8);c.fillStyle='#d98eb7';c.fillRect(x.target/x.frames*300,325,2,28);if(r.anchor!=null){c.fillStyle='#70e1cb';c.fillRect(r.anchor/x.frames*300,330,2,22)}}c.fillStyle='#fff';c.fillRect(f/x.frames*300,335,1,16);if(r.q){let [a,b]=r.source_interval;c.strokeStyle='#82b8ef';c.beginPath();r.q.forEach((y,k)=>{let px=10+k/(r.q.length-1)*280,py=425-(y-a)/(b-a-1)*60;k?c.lineTo(px,py):c.moveTo(px,py)});c.stroke();c.fillStyle='#fff';c.fillText('横轴目标时间／纵轴来源时钟',15,365)}}}
function load(){stop();i=+$('pick').value;let x=D.items[i];$('seek').max=x.frames-1;audio.hidden=x.raw;if(x.audio)audio.src=x.audio;else audio.removeAttribute('src');$('mode').textContent=x.raw?'原始来源 · 原速30FPS · 不使用目标音乐；较短来源结束后留空':`目标Core ${x.core}帧＋Bridge48帧＋相邻Core ${x.core}帧；粉线为指定目标，青线为实际代理节点`;$('panels').replaceChildren();views=x.variants.map(v=>{let a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),canvas=document.createElement('canvas');h.textContent=v.label;p.textContent=v.source||'';canvas.width=300;canvas.height=440;a.append(h,p,canvas);$('panels').append(a);return {data:v,canvas}});$('details').textContent=JSON.stringify(x.variants.map(v=>v.details||{scope:'RAW_OBSERVED_SOURCE'}),null,2);draw(0)}
function seek(n){stop();draw(n);if(!D.items[i].raw)audio.currentTime=f/30}$('pick').onchange=load;$('seek').oninput=e=>seek(+e.target.value);$('prev').onclick=()=>seek(f-1);$('next').onclick=()=>seek(f+1);$('pause').onclick=stop;$('rate').onchange=e=>{stop();rate=+e.target.value;audio.playbackRate=rate};$('play').onclick=()=>{if(D.items[i].raw){playing=true;start=performance.now()-f/30/rate*1000}else audio.play()};audio.onseeked=()=>draw(Math.floor(audio.currentTime*30+1e-4));function tick(){if(!audio.paused&&!D.items[i].raw)draw(Math.floor(audio.currentTime*30+1e-4));if(playing){draw(Math.floor((performance.now()-start)/1000*30*rate));if(f===D.items[i].frames-1)playing=false}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script>
